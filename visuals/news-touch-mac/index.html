<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Touchscreen Mac Short</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#eef2f6;--mut:#94a3b8;--acc:#ef4444;--acc2:#fca5a5;--grn:#34d399;--red:#f87171;--yel:#fbbf24;--pk:#f472b6;--cy:#22d3ee}
  #fv-stage{background:radial-gradient(1000px 1300px at 70% 12%,#3a0d16 0%,#170a12 52%,#08060c 82%);color:var(--ink);font-family:Inter,system-ui,sans-serif}
  #bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(248,113,113,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(248,113,113,.10) 1px,transparent 1px);background-size:90px 90px;opacity:.22}
  .abs{position:absolute}
  .step{position:absolute;left:0;right:0;top:250px;text-align:center;font:700 34px/1 'JetBrains Mono',monospace;letter-spacing:.2em;color:var(--acc2)}
  .head{position:absolute;left:60px;right:60px;top:305px;text-align:center;font:800 84px/1.05 Inter;letter-spacing:-.03em}
  .mono{font-family:'JetBrains Mono',monospace}
  .badge{position:absolute;left:50%;top:150px;transform:translateX(-50%);padding:12px 26px;border-radius:40px;background:color-mix(in srgb,var(--acc) 12%,transparent);border:2px solid color-mix(in srgb,var(--acc) 55%,transparent);font:700 30px Inter;color:var(--acc2);white-space:nowrap}
  .pill{display:inline-block;padding:12px 26px;border-radius:40px;font:800 32px Inter}
  .pane{position:absolute;left:120px;width:840px;height:765px;border-radius:26px;overflow:hidden;border:3px solid color-mix(in srgb,var(--acc) 45%,transparent);background:rgba(8,8,16,.75)}
  .pane svg{position:absolute;inset:0;width:840px;height:765px}
  .below{position:absolute;left:0;right:0;top:1225px;text-align:center}
  .big{font:900 120px/1 Inter;letter-spacing:-.04em;color:#fff}
  .card{border-radius:22px;padding:26px 30px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.14)}
  .fv-endcard{display:inline-block;padding:16px 30px;border-radius:40px;font:700 34px 'JetBrains Mono',monospace;border:3px solid #eef2f6;background:rgba(238,242,246,.08)}
</style>
</head>
<body>
<div id="fv-stage">
  <div id="bg-grid"></div>
  <div class="badge">📰 Tech News</div>
<div id="brk" class="abs" style="left:0;right:0;top:56px;height:62px;background:#dc2626;display:flex;align-items:center;overflow:hidden;z-index:8"><div style="flex:none;position:relative;z-index:2;padding:0 22px;height:100%;display:grid;place-items:center;background:#7f1d1d;font:900 26px Inter;letter-spacing:.1em">BREAKING</div><div style="flex:1;overflow:hidden;height:100%;display:flex;align-items:center"><div class="tk" style="white-space:nowrap;font:800 28px Inter;padding-left:20px"></div></div></div><section class="fv-scene" data-scene="hook"><div class="pane" id="hk-p" style="top:330px"></div><div id="hk-q" class="abs" style="left:0;right:0;top:1150px;text-align:center"><div class="big" style="font-size:120px">Why now? 🤔</div></div></section>
<section class="fv-scene" data-scene="arm"><div class="step">THE OLD REASON</div><div class="head">Your arm gets tired</div><div class="pane" id="ar-p" style="top:430px"></div><div class="below" id="ar-t"></div></section>
<section class="fv-scene" data-scene="pointer"><div class="step">REASON #2</div><div class="head">Built for a cursor</div><div class="pane" id="po-p" style="top:430px"></div><div class="below" id="po-t"></div></section>
<section class="fv-scene" data-scene="changed"><div class="step">WHAT CHANGED?</div><div class="head">Mac ≈ iPad inside</div><div class="pane" id="cg-p" style="top:430px"></div><div class="below" id="cg-t"></div></section>
<section class="fv-scene" data-scene="question"><div class="step">THE BIG QUESTION</div><div class="head">Will you touch it?</div><div class="pane" id="qu-p" style="top:430px"></div></section>
<section class="fv-scene" data-scene="outro"><div id="oc-w" class="abs" style="left:40px;right:40px;top:640px;display:grid;justify-items:center;gap:30px"></div></section>
</div>
<script src="timing.js"></script>
<script src="fv-runtime.js"></script>
<script>
(() => {
const { seg, css, enter, lerp, clamp, ease, pulse, $ } = FV;
const NS = 'http://www.w3.org/2000/svg';
const svgEl = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const txt = (s, x, y, str, o = {}) => { const e = svgEl('text', Object.assign({ x, y, fill: '#eef2f6', 'font-size': 30, 'font-weight': 700, 'font-family': 'Inter', 'text-anchor': 'middle' }, o), s); e.textContent = str; return e; };
const div = (cls, html, parent, style) => { const e = document.createElement('div'); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; if (style) e.style.cssText = style; if (parent) parent.appendChild(e); return e; };
const pop = (el, t, a, d = 0.45) => { const p = seg(t, a, a + d, ease.back); css(el, { o: clamp(p * 1.5), s: Math.max(0, p) }); return p; };
const head = (el, t) => { const s = el.querySelector('.step'), h = el.querySelector('.head'); if (s) enter(s, t, 0.0, 0.4); if (h) enter(h, t, 0.08, 0.45, 30); };
const frac = (ctx, i, f) => ctx.line(i) + (ctx.lineEnd(i) - ctx.line(i)) * f;
const pill = (t, c) => `<span class="pill" style="border:3px solid ${c};background:${c}1a;color:${c}">${t}</span>`;
const show = (el, html) => { if (el.__h !== html) { el.innerHTML = html; el.__h = html; } };

function flowPane(host) { return svgEl('svg', { viewBox: '0 0 840 765' }, host); }
function node(s, x, y, w, h, title, sub, c) {
  const g = svgEl('g', { opacity: 0 }, s);
  const r = svgEl('rect', { x: x - w / 2, y: y - h / 2, width: w, height: h, rx: 18, fill: '#0f172a', stroke: c, 'stroke-width': 4 }, g);
  txt(g, x, y + (sub ? -4 : 10), title, { 'font-size': 30, 'font-weight': 800, fill: '#f1f5f9' });
  if (sub) txt(g, x, y + 30, sub, { 'font-size': 22, fill: '#94a3b8', 'font-family': 'JetBrains Mono' });
  return { g, r, x, y, w, h, c };
}
function link(s, a, b, c = '#64748b') { return svgEl('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: c, 'stroke-width': 4, 'stroke-dasharray': '10 10', opacity: 0 }, s); }
function packet(s, label, c) {
  const g = svgEl('g', { opacity: 0 }, s);
  const w = Math.max(90, label.length * 15 + 34);
  svgEl('rect', { x: -w / 2, y: -24, width: w, height: 48, rx: 24, fill: c }, g);
  txt(g, 0, 9, label, { 'font-size': 24, 'font-weight': 800, fill: '#0b1020', 'font-family': 'JetBrains Mono' });
  return g;
}
function move(p, a, b, u) { if (u <= 0 || u >= 1) { p.setAttribute('opacity', 0); return; } p.setAttribute('opacity', 1); p.setAttribute('transform', `translate(${lerp(a.x, b.x, ease.inOut(u))} ${lerp(a.y, b.y, ease.inOut(u))})`); }

const ticker = (sec, text, t) => { const tk = $('#brk .tk'); tk.textContent = (text + '   •   ').repeat(4); tk.style.transform = `translateX(${-((t * 90) % 900)}px)`; };

function laptop(s, x, y, w) { const h = w * 0.62; const g = svgEl('g', {}, s);
  svgEl('rect', { x: x - w / 2, y, width: w, height: h, rx: 20, fill: '#1f2937', stroke: '#9ca3af', 'stroke-width': 5 }, g);
  const scr = svgEl('rect', { x: x - w / 2 + 16, y: y + 16, width: w - 32, height: h - 32, rx: 10, fill: '#0b1220' }, g);
  svgEl('path', { d: `M${x - w / 2 - 40} ${y + h + 4} L${x + w / 2 + 40} ${y + h + 4} L${x + w / 2 + 10} ${y + h + 30} L${x - w / 2 - 10} ${y + h + 30} Z`, fill: '#9ca3af' }, g);
  return { g, scr, cx: x, cy: y + h / 2, h }; }

/* HOOK: year counter with ❌, then a finger taps a MacBook */
{
  const s = flowPane($('#hk-p')); const yr = txt(s, 420, 130, '', { 'font-size': 96, 'font-weight': 900, 'font-family': 'JetBrains Mono', fill: '#fca5a5' });
  const no = txt(s, 420, 200, '', { 'font-size': 32, 'font-weight': 800, fill: '#cbd5e1' });
  const L = laptop(s, 420, 280, 520); const f = txt(s, 0, 0, '👆', { 'font-size': 110, opacity: 0 }); const rp = svgEl('circle', { cx: 420, cy: 0, r: 0, fill: 'none', stroke: '#93c5fd', 'stroke-width': 5 }, s);
  FV.scene('hook', (t, ctx) => { ticker(ctx.el, "Apple's first touchscreen MacBook Pro goes on sale", t); enter($('#hk-p'), t, 0.05, 0.4, 20);
    const u = seg(t, 0.3, frac(ctx, 0, 0.5), ease.linear); const y = Math.round(2010 + u * 16); yr.textContent = y; yr.setAttribute('fill', y >= 2026 ? '#86efac' : '#fca5a5');
    no.textContent = y >= 2026 ? '✅ touchscreen MacBook Pro' : '❌ no touchscreen Mac';
    const a = frac(ctx, 0, 0.6), k = seg(t, a, a + 0.6, ease.out); f.setAttribute('opacity', k > 0 ? 1 : 0); f.setAttribute('x', 470); f.setAttribute('y', lerp(760, L.cy + 95, k));
    const r = seg(t, a + 0.6, a + 1.3); rp.setAttribute('cy', L.cy); rp.setAttribute('r', r * 90); rp.setAttribute('opacity', r > 0 && r < 1 ? 1 - r : 0);
    L.scr.setAttribute('fill', r > 0 ? '#1d4ed8' : '#0b1220'); pop($('#hk-q'), t, ctx.line(1) - 0.1, 0.5); });
}
/* ARM: arm reaching to a vertical screen + fatigue meter + quote */
{
  const s = flowPane($('#ar-p')); svgEl('rect', { x: 620, y: 120, width: 26, height: 380, rx: 10, fill: '#9ca3af' }, s); svgEl('rect', { x: 560, y: 500, width: 160, height: 18, rx: 9, fill: '#9ca3af' }, s);
  const sh = { x: 200, y: 330 }; txt(s, 180, 320, '🙂', { 'font-size': 120 });
  const up = svgEl('line', { x1: sh.x + 40, y1: sh.y + 30, x2: 0, y2: 0, stroke: '#fcd34d', 'stroke-width': 30, 'stroke-linecap': 'round' }, s);
  const hand = txt(s, 0, 0, '👆', { 'font-size': 60 });
  svgEl('rect', { x: 100, y: 590, width: 640, height: 40, rx: 20, fill: 'rgba(255,255,255,.08)' }, s); const m = svgEl('rect', { x: 100, y: 590, width: 0, height: 40, rx: 20, fill: '#ef4444' }, s);
  txt(s, 100, 570, '💪 arm fatigue', { 'text-anchor': 'start', 'font-size': 28, fill: '#cbd5e1' }); const sweat = txt(s, 300, 230, '', { 'font-size': 50 });
  FV.scene('arm', (t, ctx) => { ticker(ctx.el, "Apple's first touchscreen MacBook Pro goes on sale", t); head(ctx.el, t); enter($('#ar-p'), t, 0.1, 0.4, 20);
    const f = seg(t, 0.5, ctx.dur - 0.5, ease.linear); const droop = f * 90 + Math.sin(t * 7) * 6 * f;
    const ex = 600, ey = 250 + droop; up.setAttribute('x2', ex); up.setAttribute('y2', ey); hand.setAttribute('x', ex - 4); hand.setAttribute('y', ey + 18);
    m.setAttribute('width', 640 * f); sweat.textContent = f > 0.45 ? '💦' : '';
    show($('#ar-t'), `<div class="card" style="display:inline-block;max-width:900px;padding:14px 24px;font:700 27px/1.3 Inter;text-align:left">🗣️ Steve Jobs, 2010 <span style="color:#94a3b8">(paraphrased)</span><br>"Touching a vertical screen gets tiring fast."</div>`); $('#ar-t').style.opacity = seg(t, frac(ctx, 0, 0.1), frac(ctx, 0, 0.3)); });
}
/* POINTER: tiny buttons; precise cursor vs big fingertip */
{
  const s = flowPane($('#po-p')); const B = [];
  for (let r = 0; r < 6; r++) for (let c = 0; c < 10; c++) B.push(svgEl('rect', { x: 110 + c * 64, y: 90 + r * 64, width: 46, height: 46, rx: 8, fill: '#1e293b', stroke: '#475569', 'stroke-width': 2 }, s));
  const cur = svgEl('path', { d: 'M0 0 L0 40 L11 30 L19 48 L26 45 L18 27 L32 27 Z', fill: '#fff', stroke: '#000', 'stroke-width': 2 }, s);
  const fin = svgEl('circle', { cx: 0, cy: 0, r: 70, fill: 'rgba(252,211,77,.35)', stroke: '#fcd34d', 'stroke-width': 4, opacity: 0 }, s);
  const l1 = txt(s, 420, 560, '', { 'font-size': 34, 'font-weight': 900, fill: '#93c5fd' }), l2 = txt(s, 420, 620, '', { 'font-size': 34, 'font-weight': 900, fill: '#fcd34d' });
  FV.scene('pointer', (t, ctx) => { ticker(ctx.el, "Apple's first touchscreen MacBook Pro goes on sale", t); head(ctx.el, t); enter($('#po-p'), t, 0.1, 0.4, 20);
    const a = seg(t, 0.4, frac(ctx, 0, 0.35), ease.inOut); const cx = lerp(700, 110 + 3 * 64 + 23, a), cy = lerp(500, 90 + 2 * 64 + 23, a); cur.setAttribute('transform', `translate(${cx} ${cy})`);
    const fo = frac(ctx, 0, 0.6); fin.setAttribute('opacity', seg(t, fo, fo + 0.3)); fin.setAttribute('cx', 110 + 7 * 64); fin.setAttribute('cy', 90 + 3 * 64);
    B.forEach((b, i) => { const r = Math.floor(i / 10), c = i % 10; const hitC = a >= 1 && r === 2 && c === 3; const hitF = t > fo + 0.3 && Math.abs(c - 6.65) < 1.3 && Math.abs(r - 2.65) < 1.3; b.setAttribute('fill', hitC ? '#2563eb' : hitF ? '#b45309' : '#1e293b'); });
    l1.textContent = a >= 1 ? '🖱️ cursor: hits exactly one' : ''; l2.textContent = t > fo + 0.3 ? '👆 finger: covers several' : '';
    show($('#po-t'), pill('fingers ≫ cursors', '#fcd34d')); $('#po-t').style.opacity = seg(t, frac(ctx, 0, 0.8), frac(ctx, 0, 0.95)); });
}
/* CHANGED: three cards */
{
  const host = $('#cg-p'); host.innerHTML = '<div class="g" style="position:absolute;left:40px;right:40px;top:40px;display:grid;gap:24px"></div>';
  const R = [['🧠', 'Same kind of chip as iPad', 'Apple silicon in both'], ['📱', 'Runs iPad apps', 'already built for fingers'], ['🛠️', 'Touch updates coming', 'Notion · Canva · Microsoft 365']];
  const cs = R.map(([e, a, b]) => div('card', `<div style="display:flex;align-items:center;gap:26px"><span style="font-size:76px">${e}</span><div><div style="font:800 40px Inter">${a}</div><div style="font:600 28px Inter;color:#94a3b8;margin-top:6px">${b}</div></div></div>`, host.querySelector('.g'), 'border-color:#93c5fd55'));
  FV.scene('changed', (t, ctx) => { ticker(ctx.el, "Apple's first touchscreen MacBook Pro goes on sale", t); head(ctx.el, t); enter(host, t, 0.1, 0.4, 20);
    pop(cs[0], t, frac(ctx, 0, 0.2), 0.45); pop(cs[1], t, frac(ctx, 0, 0.42), 0.45); pop(cs[2], t, frac(ctx, 0, 0.62), 0.45);
    show($('#cg-t'), pill('the hard part is mostly done', '#86efac')); $('#cg-t').style.opacity = seg(t, frac(ctx, 0, 0.85), frac(ctx, 0, 0.95)); });
}
/* QUESTION: two big choices, pulsing */
{
  const host = $('#qu-p'); host.innerHTML = '<div style="position:absolute;inset:40px;display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center"><div class="card a" style="text-align:center;padding:60px 20px;border-color:#93c5fd88"><div style="font-size:150px">👆</div><div style="font:900 50px Inter;margin-top:20px">Touch</div></div><div class="card b" style="text-align:center;padding:60px 20px;border-color:#fcd34d88"><div style="font-size:150px">🖱️</div><div style="font:900 50px Inter;margin-top:20px">Trackpad</div></div></div><div class="vs" style="position:absolute;left:0;right:0;top:330px;text-align:center;font:900 60px Inter;color:#fca5a5">or</div>';
  FV.scene('question', (t, ctx) => { ticker(ctx.el, "Apple's first touchscreen MacBook Pro goes on sale", t); head(ctx.el, t); enter(host, t, 0.1, 0.4, 20);
    const a = host.querySelector('.a'), b = host.querySelector('.b'); pop(a, t, frac(ctx, 0, 0.45), 0.4); pop(b, t, frac(ctx, 0, 0.75), 0.4);
    if (t > frac(ctx, 0, 0.95)) { a.style.transform = `scale(${1 + 0.04 * Math.sin(t * 6)})`; b.style.transform = `scale(${1 + 0.04 * Math.sin(t * 6 + Math.PI)})`; } });
}
{ const w = [div('', 'Fifteen years of no. ❌', $('#oc-w'), 'font:900 92px/1.06 Inter;letter-spacing:-.03em;color:#fca5a5;text-align:center'), div('', 'Now, a yes. ✅', $('#oc-w'), 'font:900 70px/1.1 Inter;color:#86efac;text-align:center')];
  FV.scene('outro', (t, ctx) => w.forEach((e, i) => pop(e, t, ctx.line(i) - 0.1, 0.45))); }
})();
</script>
</body>
</html>
