<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A* search Short</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#eef2f6;--mut:#94a3b8;--acc:#ef4444;--acc2:#f87171;--grn:#34d399;--red:#f87171;--yel:#fbbf24;--pk:#f472b6;--cy:#22d3ee}
  #fv-stage{background:radial-gradient(1000px 1300px at 70% 15%,#3a1414 0%,#170c12 50%,#09060a 80%);color:var(--ink);font-family:Inter,system-ui,sans-serif}
  #bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(239,68,68,.11) 1px,transparent 1px),linear-gradient(90deg,rgba(239,68,68,.11) 1px,transparent 1px);background-size:90px 90px;opacity:.22}
  .abs{position:absolute}
  .step{position:absolute;left:0;right:0;top:250px;text-align:center;font:700 34px/1 'JetBrains Mono',monospace;letter-spacing:.2em;color:var(--acc2)}
  .head{position:absolute;left:60px;right:60px;top:305px;text-align:center;font:800 84px/1.05 Inter;letter-spacing:-.03em}
  .mono{font-family:'JetBrains Mono',monospace}
  .badge{position:absolute;left:50%;top:150px;transform:translateX(-50%);padding:12px 26px;border-radius:40px;background:color-mix(in srgb,var(--acc) 12%,transparent);border:2px solid color-mix(in srgb,var(--acc) 55%,transparent);font:700 30px Inter;color:var(--acc2);white-space:nowrap}
  .pill{display:inline-block;padding:12px 26px;border-radius:40px;font:800 32px Inter}
  .pane{position:absolute;left:120px;width:840px;height:765px;border-radius:26px;overflow:hidden;border:3px solid color-mix(in srgb,var(--acc) 45%,transparent);background:rgba(8,8,16,.75)}
  .pane svg{position:absolute;inset:0;width:840px;height:765px}
  .below{position:absolute;left:0;right:0;top:1225px;text-align:center}
  .big{font:900 120px/1 Inter;letter-spacing:-.04em;color:#fff}
  .card{border-radius:22px;padding:26px 30px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.14)}
  .fv-endcard{display:inline-block;padding:16px 30px;border-radius:40px;font:700 34px 'JetBrains Mono',monospace;border:3px solid #eef2f6;background:rgba(238,242,246,.08)}
</style>
</head>
<body>
<div id="fv-stage">
  <div id="bg-grid"></div>
  <div class="badge">🤖 Robotics · Tech, decoded</div>

  <section class="fv-scene" data-scene="hook">
    <div class="pane" id="hk-p" style="top:300px"></div>
    <div id="hk-q" class="abs" style="left:0;right:0;top:1110px;text-align:center"><div class="big">🗺️ <span style="color:var(--acc2)">A*</span> search</div></div>
  </section>
  <section class="fv-scene" data-scene="blind">
    <div class="step">THE SLOW WAY</div><div class="head">Search everywhere</div>
    <div class="pane" id="bl-p" style="top:430px"></div>
    <div class="below" id="bl-t"></div>
  </section>
  <section class="fv-scene" data-scene="score">
    <div class="step">THE SMART WAY</div><div class="head">F = G + H</div>
    <div class="pane" id="sc-p" style="top:430px"></div>
    <div class="below" id="sc-t"></div>
  </section>
  <section class="fv-scene" data-scene="search">
    <div class="step">LOWEST SCORE FIRST</div><div class="head">Pulled to the goal</div>
    <div class="pane" id="se-p" style="top:430px"></div>
    <div class="below" id="se-t"></div>
  </section>
  <section class="fv-scene" data-scene="path">
    <div class="step">TRACE IT BACK</div><div class="head">The shortest path</div>
    <div class="pane" id="pa-p" style="top:430px"></div>
    <div class="below" id="pa-t"></div>
  </section>
  <section class="fv-scene" data-scene="outro">
    <div class="pane" id="oc-p" style="top:240px;transform:scale(.62);transform-origin:50% 0"></div>
    <div id="oc-w" class="abs" style="left:40px;right:40px;top:740px;display:grid;justify-items:center;gap:14px"></div>
    <div id="oc-gh" class="abs" style="left:0;right:0;top:1030px;text-align:center"><span class="fv-endcard"></span></div>
  </section>

</div>
<script src="timing.js"></script>
<script src="fv-runtime.js"></script>
<script>
(() => {
const { seg, css, enter, lerp, clamp, ease, pulse, $ } = FV;
const NS = 'http://www.w3.org/2000/svg';
const svgEl = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const txt = (s, x, y, str, o = {}) => { const e = svgEl('text', Object.assign({ x, y, fill: '#eef2f6', 'font-size': 30, 'font-weight': 700, 'font-family': 'Inter', 'text-anchor': 'middle' }, o), s); e.textContent = str; return e; };
const div = (cls, html, parent, style) => { const e = document.createElement('div'); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; if (style) e.style.cssText = style; if (parent) parent.appendChild(e); return e; };
const pop = (el, t, a, d = 0.45) => { const p = seg(t, a, a + d, ease.back); css(el, { o: clamp(p * 1.5), s: Math.max(0, p) }); return p; };
const head = (el, t) => { const s = el.querySelector('.step'), h = el.querySelector('.head'); if (s) enter(s, t, 0.0, 0.4); if (h) enter(h, t, 0.08, 0.45, 30); };
const frac = (ctx, i, f) => ctx.line(i) + (ctx.lineEnd(i) - ctx.line(i)) * f;
const pill = (t, c) => `<span class="pill" style="border:3px solid ${c};background:${c}1a;color:${c}">${t}</span>`;
const show = (el, html) => { if (el.__h !== html) { el.innerHTML = html; el.__h = html; } };

const C = 14, Rw = 12, Z = 56, OX = 28, OY = 46;
const WALL = new Set();
const wall = (c0, r0, c1, r1) => { for (let c = c0; c <= c1; c++) for (let r = r0; r <= r1; r++) WALL.add(r * C + c); };
wall(5, 2, 5, 8); wall(5, 2, 9, 2); wall(9, 6, 9, 11); wall(11, 4, 13, 4);
const S = [1, 1], G = [12, 10];
const id = (c, r) => r * C + c, cr = (i) => [i % C, Math.floor(i / C)];
const nbrs = (i) => { const [c, r] = cr(i); return [[1,0],[-1,0],[0,1],[0,-1]].map(([dc, dr]) => [c + dc, r + dr]).filter(([x, y]) => x >= 0 && y >= 0 && x < C && y < Rw && !WALL.has(id(x, y))).map(([x, y]) => id(x, y)); };
const h = (i) => { const [c, r] = cr(i); return Math.abs(c - G[0]) + Math.abs(r - G[1]); };
/* breadth-first: visit order */
const BFS = (() => { const seen = new Set([id(...S)]), q = [id(...S)], order = []; while (q.length) { const i = q.shift(); order.push(i); if (i === id(...G)) break; for (const n of nbrs(i)) if (!seen.has(n)) { seen.add(n); q.push(n); } } return order; })();
/* A*: visit order + path */
const AST = (() => {
  const start = id(...S), goal = id(...G), g = new Map([[start, 0]]), from = new Map(), open = new Set([start]), closed = [];
  while (open.size) {
    let cur = null, best = 1e9; for (const o of open) { const f = g.get(o) + h(o); if (f < best - 1e-9 || (Math.abs(f - best) < 1e-9 && h(o) < h(cur))) { best = f; cur = o; } }
    open.delete(cur); closed.push(cur); if (cur === goal) break;
    for (const n of nbrs(cur)) { const ng = g.get(cur) + 1; if (ng < (g.get(n) ?? 1e9)) { g.set(n, ng); from.set(n, cur); open.add(n); } }
  }
  const path = [goal]; while (path[0] !== start && from.has(path[0])) path.unshift(from.get(path[0]));
  return { closed, path, g };
})();
const center = (i) => { const [c, r] = cr(i); return [OX + c * Z + Z / 2, OY + r * Z + Z / 2]; };
function board(host) {
  const s = svgEl('svg', { viewBox: '0 0 840 765' }, host), cells = [];
  for (let r = 0; r < Rw; r++) for (let c = 0; c < C; c++) cells.push(svgEl('rect', { x: OX + c * Z + 2, y: OY + r * Z + 2, width: Z - 4, height: Z - 4, rx: 7, fill: WALL.has(id(c, r)) ? '#475569' : 'rgba(255,255,255,.05)' }, s));
  const pl = svgEl('polyline', { fill: 'none', stroke: '#fbbf24', 'stroke-width': 10, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, s);
  const [sx, sy] = center(id(...S)), [gx, gy] = center(id(...G));
  const bot = svgEl('text', { x: sx, y: sy + 14, 'text-anchor': 'middle', 'font-size': 40 }, s); bot.textContent = '🤖';
  const flag = svgEl('text', { x: gx, y: gy + 14, 'text-anchor': 'middle', 'font-size': 40 }, s); flag.textContent = '🏁';
  return { s, cells, pl, bot };
}
const paint = (B, order, n, col) => order.forEach((i, k) => { if (!WALL.has(i)) B.cells[i].setAttribute('fill', k < n ? col(k) : 'rgba(255,255,255,.05)'); });
const drawPath = (B, u) => { const k = Math.max(1, Math.round(u * (AST.path.length - 1))); B.pl.setAttribute('points', AST.path.slice(0, k + 1).map((i) => center(i).join(',')).join(' ')); };
/* HOOK */
{
  const B = board($('#hk-p'));
  FV.scene('hook', (t, ctx) => {
    enter($('#hk-p'), t, 0.05, 0.4, 20);
    const u = seg(t, frac(ctx, 0, 0.5), frac(ctx, 0, 0.95), ease.inOut); drawPath(B, u); B.pl.setAttribute('opacity', u > 0 ? 1 : 0);
    pop($('#hk-q'), t, ctx.line(1) - 0.1, 0.5);
  });
}
/* BLIND: BFS flood */
{
  const B = board($('#bl-p'));
  FV.scene('blind', (t, ctx) => {
    head(ctx.el, t); enter($('#bl-p'), t, 0.1, 0.4, 20);
    const n = Math.round(seg(t, frac(ctx, 0, 0.05), frac(ctx, 0, 0.95), ease.linear) * BFS.length);
    paint(B, BFS, n, (k) => `hsla(${200 - (k / BFS.length) * 160},80%,55%,.55)`);
    show($('#bl-t'), pill(`${n} squares checked`, '#f87171')); $('#bl-t').style.opacity = seg(t, 0.3, 0.6);
  });
}
/* SCORE: one square's g and h */
{
  const B = board($('#sc-p'));
  const pick = AST.path[7], [px, py] = center(pick), [sx, sy] = center(id(...S)), [gx, gy] = center(id(...G));
  B.cells[pick].setAttribute('fill', 'rgba(34,211,238,.6)');
  const gLine = svgEl('polyline', { fill: 'none', stroke: '#22d3ee', 'stroke-width': 8, points: AST.path.slice(0, 8).map((i) => center(i).join(',')).join(' '), opacity: 0 }, B.s);
  const hLine = svgEl('polyline', { points: `${px},${py} ${gx},${py} ${gx},${gy}`, fill: 'none', stroke: '#f472b6', 'stroke-width': 6, 'stroke-dasharray': '12 10', opacity: 0 }, B.s);
  const gV = AST.g.get(pick), hV = h(pick);
  const box = svgEl('g', { opacity: 0 }, B.s); svgEl('rect', { x: 36, y: 540, width: 380, height: 190, rx: 18, fill: '#0b1020', stroke: '#fbbf24', 'stroke-width': 3 }, box);
  const l1 = txt(box, 226, 592, `G = ${gV}  steps so far`, { fill: '#22d3ee', 'font-size': 30 }), l2 = txt(box, 226, 642, `H = ${hV}  guess left`, { fill: '#f472b6', 'font-size': 30 }), l3 = txt(box, 226, 698, `F = ${gV + hV}`, { fill: '#fbbf24', 'font-size': 40, 'font-weight': 900 });
  FV.scene('score', (t, ctx) => {
    head(ctx.el, t); enter($('#sc-p'), t, 0.1, 0.4, 20);
    gLine.setAttribute('opacity', seg(t, frac(ctx, 0, 0.3), frac(ctx, 0, 0.4)));
    hLine.setAttribute('opacity', seg(t, frac(ctx, 0, 0.62), frac(ctx, 0, 0.72)));
    box.setAttribute('opacity', seg(t, frac(ctx, 0, 0.25), frac(ctx, 0, 0.35)));
    l1.setAttribute('opacity', seg(t, frac(ctx, 0, 0.3), frac(ctx, 0, 0.4))); l2.setAttribute('opacity', seg(t, frac(ctx, 0, 0.62), frac(ctx, 0, 0.72))); l3.setAttribute('opacity', seg(t, frac(ctx, 0, 0.85), frac(ctx, 0, 0.95)));
    show($('#sc-t'), pill('distance so far + smart guess', '#fbbf24')); $('#sc-t').style.opacity = seg(t, 0.4, 0.7);
  });
}
/* SEARCH: A* expansion */
{
  const B = board($('#se-p'));
  FV.scene('search', (t, ctx) => {
    head(ctx.el, t); enter($('#se-p'), t, 0.1, 0.4, 20);
    const n = Math.round(seg(t, frac(ctx, 0, 0.05), frac(ctx, 0, 0.95), ease.linear) * AST.closed.length);
    paint(B, AST.closed, n, () => 'rgba(34,211,238,.45)');
    show($('#se-t'), pill(`${n} squares checked`, '#22d3ee')); $('#se-t').style.opacity = seg(t, 0.3, 0.6);
  });
}
/* PATH: trace back, compare counts */
{
  const B = board($('#pa-p')); paint(B, AST.closed, AST.closed.length, () => 'rgba(34,211,238,.25)');
  FV.scene('path', (t, ctx) => {
    head(ctx.el, t); enter($('#pa-p'), t, 0.1, 0.4, 20);
    drawPath(B, seg(t, frac(ctx, 0, 0.05), frac(ctx, 0, 0.55), ease.inOut));
    show($('#pa-t'), pill(`A*: ${AST.closed.length} squares · blind: ${BFS.length}`, '#34d399')); pop($('#pa-t'), t, frac(ctx, 0, 0.6), 0.45);
  });
}
/* OUTRO */
{
  const B = board($('#oc-p')); paint(B, AST.closed, AST.closed.length, () => 'rgba(34,211,238,.25)'); drawPath(B, 1);
  const Wd = [['G + H = F', '#fbbf24', 0], ['Distance so far,', '#22d3ee', 0.3], ['plus a smart guess.', '#f472b6', 0.55]];
  const words = Wd.map(([w, c]) => div('', w, $('#oc-w'), `font:900 78px/1.05 Inter;letter-spacing:-.03em;color:${c}`));
  FV.scene('outro', (t, ctx) => {
    $('#oc-p').style.opacity = seg(t, 0.05, 0.4);
    words.forEach((w, i) => pop(w, t, frac(ctx, 0, Wd[i][2]), 0.4));
    pop($('#oc-gh'), t, frac(ctx, 0, 0.95), 0.5);
  });
}

})();
</script>
</body>
</html>
