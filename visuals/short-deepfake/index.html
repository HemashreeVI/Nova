<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deepfake Short</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#eef2f6;--mut:#94a3b8;--acc:#6366f1;--acc2:#a5b4fc;--grn:#34d399;--red:#f87171;--yel:#fbbf24;--pk:#f472b6;--cy:#22d3ee}
  #fv-stage{background:radial-gradient(1000px 1300px at 70% 15%,#1e1b5e 0%,#0f0f2e 50%,#07071a 80%);color:var(--ink);font-family:Inter,system-ui,sans-serif}
  #bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(99,102,241,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(99,102,241,.13) 1px,transparent 1px);background-size:90px 90px;opacity:.22}
  .abs{position:absolute}
  .step{position:absolute;left:0;right:0;top:250px;text-align:center;font:700 34px/1 'JetBrains Mono',monospace;letter-spacing:.2em;color:var(--acc2)}
  .head{position:absolute;left:60px;right:60px;top:305px;text-align:center;font:800 84px/1.05 Inter;letter-spacing:-.03em}
  .mono{font-family:'JetBrains Mono',monospace}
  .badge{position:absolute;left:50%;top:150px;transform:translateX(-50%);padding:12px 26px;border-radius:40px;background:color-mix(in srgb,var(--acc) 12%,transparent);border:2px solid color-mix(in srgb,var(--acc) 55%,transparent);font:700 30px Inter;color:var(--acc2);white-space:nowrap}
  .pill{display:inline-block;padding:12px 26px;border-radius:40px;font:800 32px Inter}
  .pane{position:absolute;left:120px;width:840px;height:765px;border-radius:26px;overflow:hidden;border:3px solid color-mix(in srgb,var(--acc) 45%,transparent);background:rgba(8,8,16,.75)}
  .pane svg{position:absolute;inset:0;width:840px;height:765px}
  .below{position:absolute;left:0;right:0;top:1225px;text-align:center}
  .big{font:900 120px/1 Inter;letter-spacing:-.04em;color:#fff}
  .card{border-radius:22px;padding:26px 30px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.14)}
  .fv-endcard{display:inline-block;padding:16px 30px;border-radius:40px;font:700 34px 'JetBrains Mono',monospace;border:3px solid #eef2f6;background:rgba(238,242,246,.08)}
</style>
</head>
<body>
<div id="fv-stage">
  <div id="bg-grid"></div>
  <div class="badge">🧠 AI · Tech, decoded</div>
<section class="fv-scene" data-scene="hook"><div class="pane" id="hk-p" style="top:300px"></div><div id="hk-q" class="abs" style="left:0;right:0;top:1110px;text-align:center"><div class="big">🎭 <span style="color:var(--acc2)">Deepfake</span></div></div></section>
<section class="fv-scene" data-scene="learn"><div class="step">STEP 1</div><div class="head">Learn one face</div><div class="pane" id="le-p" style="top:430px"></div><div class="below" id="le-t"></div></section>
<section class="fv-scene" data-scene="swap"><div class="step">STEP 2</div><div class="head">Redraw, frame by frame</div><div class="pane" id="sw-p" style="top:430px"></div><div class="below" id="sw-t"></div></section>
<section class="fv-scene" data-scene="spot"><div class="step">HOW TO SPOT ONE</div><div class="head">Look for clues</div><div class="pane" id="sp-p" style="top:430px"></div><div class="below" id="sp-t"></div></section>
<section class="fv-scene" data-scene="defend"><div class="step">BEST DEFENCE</div><div class="head">Verify another way</div><div id="df-c" class="abs" style="left:90px;right:90px;top:450px;display:grid;gap:24px"></div></section>
<section class="fv-scene" data-scene="outro"><div id="oc-w" class="abs" style="left:40px;right:40px;top:620px;display:grid;justify-items:center;gap:22px"></div></section>
</div>
<script src="timing.js"></script>
<script src="fv-runtime.js"></script>
<script>
(() => {
const { seg, css, enter, lerp, clamp, ease, pulse, $ } = FV;
const NS = 'http://www.w3.org/2000/svg';
const svgEl = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const txt = (s, x, y, str, o = {}) => { const e = svgEl('text', Object.assign({ x, y, fill: '#eef2f6', 'font-size': 30, 'font-weight': 700, 'font-family': 'Inter', 'text-anchor': 'middle' }, o), s); e.textContent = str; return e; };
const div = (cls, html, parent, style) => { const e = document.createElement('div'); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; if (style) e.style.cssText = style; if (parent) parent.appendChild(e); return e; };
const pop = (el, t, a, d = 0.45) => { const p = seg(t, a, a + d, ease.back); css(el, { o: clamp(p * 1.5), s: Math.max(0, p) }); return p; };
const head = (el, t) => { const s = el.querySelector('.step'), h = el.querySelector('.head'); if (s) enter(s, t, 0.0, 0.4); if (h) enter(h, t, 0.08, 0.45, 30); };
const frac = (ctx, i, f) => ctx.line(i) + (ctx.lineEnd(i) - ctx.line(i)) * f;
const pill = (t, c) => `<span class="pill" style="border:3px solid ${c};background:${c}1a;color:${c}">${t}</span>`;
const show = (el, html) => { if (el.__h !== html) { el.innerHTML = html; el.__h = html; } };

/* a simple face drawing: skin, hair, eyes, mouth (open amount), with optional glitches */
function faceSVG(s, cx, cy, k = 1, o = {}) {
  const g = svgEl('g', { transform: `translate(${cx} ${cy}) scale(${k})` }, s);
  svgEl('ellipse', { cx: 0, cy: -130, rx: 165, ry: 120, fill: '#1f2937' }, g);
  const sk = svgEl('ellipse', { cx: 0, cy: 0, rx: 150, ry: 190, fill: o.skin || '#d4a373' }, g);
  [-55, 55].forEach((x) => { svgEl('ellipse', { cx: x, cy: -30, rx: 26, ry: 14, fill: '#fff' }, g); svgEl('circle', { cx: x, cy: -30, r: 10, fill: '#1f2937' }, g); });
  svgEl('path', { d: 'M 0 -10 L -14 50 L 6 54', fill: 'none', stroke: '#8d5a3b', 'stroke-width': 5 }, g);
  const m = svgEl('ellipse', { cx: 0, cy: 105, rx: 45, ry: 8, fill: '#7f1d1d' }, g);
  const teeth = svgEl('rect', { x: -30, y: 98, width: 60, height: 0, fill: '#f8fafc' }, g);
  svgEl('rect', { x: -60, y: 200, width: 120, height: 80, fill: o.skin || '#d4a373' }, g);
  svgEl('path', { d: 'M -230 330 Q 0 210 230 330 Z', fill: '#1e3a8a' }, g);
  return { g, sk, m, teeth };
}
/* HOOK: a video call that isn't real */
{
  const host = $('#hk-p'), s = svgEl('svg', { viewBox: '0 0 840 765' }, host);
  svgEl('rect', { x: 0, y: 0, width: 840, height: 765, fill: '#111827' }, s);
  const F = faceSVG(s, 420, 380, 1.05);
  const live = svgEl('g', {}, s); svgEl('rect', { x: 30, y: 30, width: 270, height: 50, rx: 25, fill: '#ef4444' }, live); txt(live, 165, 64, '● LIVE · Boss', { 'font-size': 26, fill: '#fff', 'font-weight': 800 });
  const fake = svgEl('g', { opacity: 0 }, s); svgEl('rect', { x: 170, y: 640, width: 500, height: 80, rx: 16, fill: 'none', stroke: '#f472b6', 'stroke-width': 6 }, fake); txt(fake, 420, 694, '⚠ AI-GENERATED', { 'font-size': 44, fill: '#f472b6', 'font-weight': 900 });
  FV.scene('hook', (t, ctx) => {
    enter(host, t, 0.05, 0.4, 20);
    F.m.setAttribute('ry', 8 + 14 * Math.abs(Math.sin(t * 9)) * (t < frac(ctx, 0, 0.7) ? 1 : 0));
    const gl = pulse(t, frac(ctx, 0, 0.7), frac(ctx, 0, 0.9)); F.g.setAttribute('transform', `translate(${420 + Math.sin(t * 60) * 14 * gl} 380) scale(1.05)`);
    fake.setAttribute('opacity', seg(t, frac(ctx, 0, 0.75), frac(ctx, 0, 0.85)));
    pop($('#hk-q'), t, ctx.line(1) - 0.1, 0.5);
  });
}
/* LEARN: thousands of photos of one face */
{
  const host = $('#le-p'); host.innerHTML = '<div class="g" style="position:absolute;inset:30px 30px 170px;display:grid;grid-template-columns:repeat(8,1fr);gap:8px"></div><div class="m" style="position:absolute;left:0;right:0;bottom:30px;text-align:center"></div>';
  const E = ['🙂', '😀', '😮', '😐', '🙁', '😉', '😃', '🤨'];
  const tiles = Array.from({ length: 48 }, (_, i) => div('', E[(i * 5) % 8], host.querySelector('.g'), `font-size:46px;text-align:center;border-radius:10px;background:#1e1b4b;opacity:0;transform:rotate(${((i * 13) % 21) - 10}deg)`));
  FV.scene('learn', (t, ctx) => {
    head(ctx.el, t); enter(host, t, 0.1, 0.4, 20);
    const u = seg(t, frac(ctx, 0, 0.05), frac(ctx, 0, 0.7), ease.linear);
    tiles.forEach((x, i) => x.style.opacity = i / tiles.length < u ? 1 : 0);
    show(host.querySelector('.m'), `<span class="pill mono" style="font-size:32px;border:3px solid #a5b4fc;color:#a5b4fc;background:#a5b4fc1a">${Math.round(u * 4000).toLocaleString('en-US')} photos → 🧠 model</span>`);
    show($('#le-t'), pill('every angle, every expression', '#a5b4fc')); $('#le-t').style.opacity = seg(t, 0.4, 0.7);
  });
}
/* SWAP: actor moves, output follows with the other face */
{
  const host = $('#sw-p'), s = svgEl('svg', { viewBox: '0 0 840 765' }, host);
  txt(s, 210, 60, 'actor', { 'font-size': 30, fill: '#94a3b8' }); txt(s, 630, 60, 'output', { 'font-size': 30, fill: '#f472b6' });
  const A = faceSVG(s, 210, 360, 0.75, { skin: '#8d5524' }), B = faceSVG(s, 630, 360, 0.75);
  const ar = txt(s, 420, 380, '➜', { 'font-size': 80, fill: '#f472b6' });
  const fr = txt(s, 420, 700, '', { 'font-size': 32, 'font-family': 'JetBrains Mono', fill: '#a5b4fc' });
  FV.scene('swap', (t, ctx) => {
    head(ctx.el, t); enter(host, t, 0.1, 0.4, 20);
    const tilt = Math.sin(t * 2.2) * 10, open = 8 + 16 * Math.abs(Math.sin(t * 6));
    [A, B].forEach((F, i) => { F.g.setAttribute('transform', `translate(${i ? 630 : 210} 360) scale(0.75) rotate(${tilt})`); F.m.setAttribute('ry', open); });
    fr.textContent = `frame ${Math.floor(t * 30)} / ${Math.floor(ctx.dur * 30)}`;
    show($('#sw-t'), pill('copies every move and expression', '#f472b6')); $('#sw-t').style.opacity = seg(t, 0.4, 0.7);
  });
}
/* SPOT: four clues */
{
  const host = $('#sp-p'), s = svgEl('svg', { viewBox: '0 0 840 765' }, host);
  const F = faceSVG(s, 300, 360, 1); F.teeth.setAttribute('height', 14); F.m.setAttribute('ry', 18);
  const blur = svgEl('ellipse', { cx: 300, cy: 360, rx: 160, ry: 200, fill: 'none', stroke: '#d4a373', 'stroke-width': 18, opacity: 0.5, filter: 'blur(6px)' }, s);
  svgEl('rect', { x: 300, y: 170, width: 150, height: 380, fill: '#fde68a', opacity: 0.18 }, s);
  const C = [[125, 220, '1', 'blurry hair & jaw edge'], [470, 250, '2', "lighting doesn't match"], [350, 470, '3', 'odd teeth'], [170, 520, '4', 'lips out of sync']];
  const marks = C.map(([x, y, n, l]) => { const g = svgEl('g', { opacity: 0 }, s); svgEl('circle', { cx: x, cy: y, r: 26, fill: '#f472b6' }, g); txt(g, x, y + 10, n, { 'font-size': 28, 'font-weight': 900, fill: '#0b1020' }); return g; });
  const list = svgEl('g', {}, s); const L = C.map(([, , n, l], i) => txt(list, 530, 470 + i * 50, `${n}. ${l}`, { 'text-anchor': 'start', 'font-size': 23, fill: '#f9a8d4', opacity: 0 }));
  
  FV.scene('spot', (t, ctx) => {
    head(ctx.el, t); enter(host, t, 0.1, 0.4, 20);
    marks.forEach((m, i) => { const a = frac(ctx, 0, 0.15 + i * 0.18); m.setAttribute('opacity', seg(t, a, a + 0.2)); L[i].setAttribute('opacity', seg(t, a, a + 0.2)); });
    F.m.setAttribute('ry', 10 + 10 * Math.abs(Math.sin(t * 7 + 1)));
    show($('#sp-t'), pill('…but good fakes hide these', '#fbbf24')); $('#sp-t').style.opacity = seg(t, frac(ctx, 0, 0.85), frac(ctx, 0, 0.95));
  });
}
/* DEFEND */
{
  const D = [['📞', 'Call asks for money or a password?', 'that urgency is the red flag', '#f87171'], ['✋', 'Hang up', "don't act inside the call", '#fbbf24'], ['✅', 'Call back on a number you already have', 'or check in person', '#34d399']];
  const cards = D.map(([i, a, b, c]) => div('card', `<div style="display:flex;gap:22px;align-items:center"><div style="font-size:60px">${i}</div><div><div style="font:800 36px/1.2 Inter;color:${c}">${a}</div><div style="font:500 26px Inter;color:#cbd5e1;margin-top:6px">${b}</div></div></div>`, $('#df-c'), `border-color:${c}66`));
  FV.scene('defend', (t, ctx) => { head(ctx.el, t); cards.forEach((c, i) => enter(c, t, frac(ctx, 0, 0.3 + i * 0.2), 0.45, 30)); });
}
/* OUTRO */
{
  const Wd = [['Seeing is no longer believing.', '#f472b6', 0], ['Verify first.', '#34d399', 0.5]];
  const w = Wd.map(([s, c]) => div('', s, $('#oc-w'), `font:900 88px/1.08 Inter;letter-spacing:-.03em;color:${c};text-align:center`));
  FV.scene('outro', (t, ctx) => w.forEach((e, i) => pop(e, t, frac(ctx, 0, Wd[i][2]), 0.45)));
}

})();
</script>
</body>
</html>
