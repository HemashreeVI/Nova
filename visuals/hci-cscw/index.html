     radial-gradient(circle at 45% 80%,#f472b688 0 30px,transparent 31px),radial-gradient(circle at 85% 20%,#fbbf2488 0 35px,transparent 36px),
     repeating-linear-gradient(0deg,#1e293b 0 2px,transparent 2px 26px),repeating-linear-gradient(90deg,#1e293b 0 2px,transparent 2px 26px),#0e1530}
