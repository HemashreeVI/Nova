<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsApp POV Short</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#eef2f6;--mut:#94a3b8;--acc:#25d366;--acc2:#86efac;--grn:#34d399;--red:#f87171;--yel:#fbbf24;--pk:#f472b6;--cy:#22d3ee}
  #fv-stage{background:#000;color:var(--ink);font-family:Inter,system-ui,sans-serif}
  #bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,0,0,0) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,0) 1px,transparent 1px);background-size:90px 90px;opacity:.22}
  .abs{position:absolute}
  .step{position:absolute;left:0;right:0;top:250px;text-align:center;font:700 34px/1 'JetBrains Mono',monospace;letter-spacing:.2em;color:var(--acc2)}
  .head{position:absolute;left:60px;right:60px;top:305px;text-align:center;font:800 84px/1.05 Inter;letter-spacing:-.03em}
  .mono{font-family:'JetBrains Mono',monospace}
  .badge{position:absolute;left:50%;top:150px;transform:translateX(-50%);padding:12px 26px;border-radius:40px;background:color-mix(in srgb,var(--acc) 12%,transparent);border:2px solid color-mix(in srgb,var(--acc) 55%,transparent);font:700 30px Inter;color:var(--acc2);white-space:nowrap}
  .pill{display:inline-block;padding:12px 26px;border-radius:40px;font:800 32px Inter}
  .pane{position:absolute;left:120px;width:840px;height:765px;border-radius:26px;overflow:hidden;border:3px solid color-mix(in srgb,var(--acc) 45%,transparent);background:rgba(8,8,16,.75)}
  .pane svg{position:absolute;inset:0;width:840px;height:765px}
  .below{position:absolute;left:0;right:0;top:1225px;text-align:center}
  .big{font:900 120px/1 Inter;letter-spacing:-.04em;color:#fff}
  .card{border-radius:22px;padding:26px 30px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.14)}
  .fv-endcard{display:inline-block;padding:16px 30px;border-radius:40px;font:700 34px 'JetBrains Mono',monospace;border:3px solid #eef2f6;background:rgba(238,242,246,.08)}
</style>
</head>
<body>
<div id="fv-stage">
  <div id="bg-grid"></div>
  <div class="badge">💬 Tech, decoded</div>
<style>
.photo{position:absolute;inset:0;overflow:hidden}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 45%}
.photo::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,5,15,.55) 0%,rgba(5,5,15,0) 26%,rgba(5,5,15,0) 58%,rgba(5,5,15,.88) 100%)}
.glass{position:absolute;border-radius:26px;background:rgba(10,14,26,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1.5px solid rgba(255,255,255,.18);box-shadow:0 20px 60px rgba(0,0,0,.45);color:#fff}
.k{font:700 22px 'JetBrains Mono',monospace;letter-spacing:.14em;color:#86efac}
.ttl{position:absolute;left:60px;right:60px;text-align:center;font:900 88px/1.06 Inter;letter-spacing:-.03em;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.7)}
#route{position:absolute;left:60px;right:60px;top:200px;height:96px;z-index:6}
#fv-stage .badge{z-index:7;background:rgba(10,10,25,.55);backdrop-filter:blur(8px)}
#fv-stage #fv-caption{bottom:300px!important}
.bub{display:inline-block;max-width:560px;padding:20px 26px;border-radius:26px 26px 6px 26px;background:#005c4b;color:#fff;font:600 38px Inter}
</style><svg id="route" viewBox="0 0 960 96"></svg><section class="fv-scene" data-scene="hook"><div class="photo"><img src="img/w1.jpg" alt=""></div><div class="glass" id="hk-c" style="left:200px;right:200px;top:880px;padding:26px 28px"></div><div class="ttl" id="hk-q" style="top:1250px;font-size:72px">Destination: <span style="color:#86efac">Mumbai</span> 🇮🇳</div></section>
<section class="fv-scene" data-scene="lock"><div class="photo"><img src="img/w1.jpg" alt=""></div><div class="glass" id="lk-c" style="left:120px;right:120px;top:640px;padding:36px 36px;text-align:center"></div></section>
<section class="fv-scene" data-scene="server"><div class="photo"><img src="img/w2.jpg" alt=""></div><div class="glass" id="sv-c" style="left:120px;right:120px;top:1060px;padding:28px 32px"></div></section>
<section class="fv-scene" data-scene="cable"><div class="photo"><img src="img/w3.jpg" alt=""></div><div class="glass" id="cb-c" style="left:140px;right:140px;top:420px;padding:24px 30px;text-align:center"></div><div id="cb-l" style="position:absolute;inset:0;pointer-events:none"></div></section>
<section class="fv-scene" data-scene="land"><div class="photo"><img src="img/w4.jpg" alt=""></div><div class="glass" id="ld-c" style="left:110px;right:110px;top:420px;padding:24px 30px;text-align:center"></div></section>
<section class="fv-scene" data-scene="city"><div class="photo"><img src="img/w5.jpg" alt=""></div><div class="glass" id="ct-c" style="left:110px;right:110px;top:420px;padding:24px 30px;text-align:center"></div></section>
<section class="fv-scene" data-scene="arrive"><div class="photo"><img src="img/w6.jpg" alt=""></div><div class="glass" id="ar-c" style="left:220px;right:150px;top:400px;padding:22px 26px"></div></section>
<section class="fv-scene" data-scene="outro"><div class="photo"><img src="img/w3.jpg" alt=""></div><div class="ttl" id="oc-a" style="top:560px;font-size:74px">12,000+ km.<br>Under an ocean.</div><div class="ttl" id="oc-b" style="top:880px;font-size:100px;color:#86efac">In under a second. ⚡</div></section>
</div>
<script src="timing.js"></script>
<script src="fv-runtime.js"></script>
<script>
(() => {
const { seg, css, enter, lerp, clamp, ease, pulse, $ } = FV;
const NS = 'http://www.w3.org/2000/svg';
const svgEl = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const txt = (s, x, y, str, o = {}) => { const e = svgEl('text', Object.assign({ x, y, fill: '#eef2f6', 'font-size': 30, 'font-weight': 700, 'font-family': 'Inter', 'text-anchor': 'middle' }, o), s); e.textContent = str; return e; };
const div = (cls, html, parent, style) => { const e = document.createElement('div'); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; if (style) e.style.cssText = style; if (parent) parent.appendChild(e); return e; };
const pop = (el, t, a, d = 0.45) => { const p = seg(t, a, a + d, ease.back); css(el, { o: clamp(p * 1.5), s: Math.max(0, p) }); return p; };
const head = (el, t) => { const s = el.querySelector('.step'), h = el.querySelector('.head'); if (s) enter(s, t, 0.0, 0.4); if (h) enter(h, t, 0.08, 0.45, 30); };
const frac = (ctx, i, f) => ctx.line(i) + (ctx.lineEnd(i) - ctx.line(i)) * f;
const pill = (t, c) => `<span class="pill" style="border:3px solid ${c};background:${c}1a;color:${c}">${t}</span>`;
const show = (el, html) => { if (el.__h !== html) { el.innerHTML = html; el.__h = html; } };

const kb = (sec, t, dur, a = 1.04, b = 1.14) => { sec.querySelector('.photo img').style.transform = `scale(${lerp(a, b, clamp(t / dur))})`; };
const dim = (sec, v) => { sec.querySelector('.photo img').style.filter = `brightness(${v})`; };
/* route bar: stops light up as the message travels; driven by global time */
const R = $('#route');
const STOPS = [['📱', 'New York'], ['🖥️', 'server'], ['🌊', 'ocean'], ['🏖️', 'shore'], ['🌆', 'Mumbai'], ['📱', 'her phone']];
svgEl('rect', { x: 0, y: 0, width: 960, height: 96, rx: 22, fill: 'rgba(10,14,26,.7)', stroke: 'rgba(255,255,255,.18)' }, R);
svgEl('line', { x1: 70, y1: 38, x2: 890, y2: 38, stroke: '#334155', 'stroke-width': 5, 'stroke-linecap': 'round' }, R);
const prog = svgEl('line', { x1: 70, y1: 38, x2: 70, y2: 38, stroke: '#25d366', 'stroke-width': 5, 'stroke-linecap': 'round' }, R);
const SX = STOPS.map((_, i) => 70 + i * 164);
const dots = STOPS.map(([e, l], i) => { const g = svgEl('g', {}, R); svgEl('circle', { cx: SX[i], cy: 38, r: 22, fill: '#0f172a', stroke: '#475569', 'stroke-width': 3 }, g); txt(g, SX[i], 47, e, { 'font-size': 22 }); txt(g, SX[i], 84, l, { 'font-size': 19, fill: '#cbd5e1', 'font-weight': 700 }); return g; });
const pkt = svgEl('circle', { cx: 70, cy: 38, r: 8, fill: '#fff' }, R);
const ORDER = ['hook', 'lock', 'server', 'cable', 'land', 'city', 'arrive'], AT = { hook: 0, lock: 0, server: 1, cable: 2, land: 3, city: 4, arrive: 5 };
let cur = 0; const setRoute = (pos) => { const x = lerp(70, 890, pos / 5); prog.setAttribute('x2', x); pkt.setAttribute('cx', x); dots.forEach((d, i) => d.querySelector('circle').setAttribute('stroke', i <= pos + 0.01 ? '#25d366' : '#475569')); R.style.opacity = 1; };
const routeScene = (id, t, ctx) => { const i = AT[id], prev = ORDER.indexOf(id) ? AT[ORDER[ORDER.indexOf(id) - 1]] : 0; setRoute(lerp(prev, i, seg(t, 0.1, 1.0, ease.inOut))); };
/* HOOK: typing on his phone, the bubble sends */
{
  const c = $('#hk-c'); c.innerHTML = `<div class="k" style="color:#94a3b8">🗽 NEW YORK · 11:30 PM</div><div style="margin-top:16px;text-align:right"><span class="bub"><span class="tx"></span><span style="font-size:22px;color:#a7f3d0;margin-left:10px" class="tk"></span></span></div>`;
  const msg = 'Happy birthday Riya!! 🎂🎉';
  FV.scene('hook', (t, ctx) => {
    kb(ctx.el, t, ctx.dur, 1.02, 1.1); routeScene('hook', 0, ctx); R.style.opacity = seg(t, 0.5, 1);
    enter(c, t, 0.6, 0.45, 30); c.querySelector('.tx').textContent = msg.slice(0, Math.round(seg(t, 1.0, frac(ctx, 0, 0.75), ease.linear) * msg.length));
    c.querySelector('.tk').textContent = t > frac(ctx, 0, 0.85) ? '11:30 ✓' : '';
    pop($('#hk-q'), t, ctx.line(1) - 0.1, 0.5);
  });
}
/* LOCK: plaintext scrambles into ciphertext */
{
  const c = $('#lk-c'); const P = 'Happy birthday Riya!! 🎂🎉', G = 'x9#Fq2!kP@7$Lm4&Zr8%Wv1';
  c.innerHTML = `<div class="k">🔐 END-TO-END ENCRYPTED</div><div class="m mono" style="margin-top:20px;font:800 44px 'JetBrains Mono';min-height:60px"></div><div style="margin-top:22px;font:700 30px Inter;color:#cbd5e1">🔑 only <b style="color:#86efac">Riya's phone</b> can open this</div>`;
  FV.scene('lock', (t, ctx) => {
    kb(ctx.el, t, ctx.dur, 1.1, 1.16); dim(ctx.el, 0.4); routeScene('lock', t, ctx); enter(c, t, 0.15, 0.45, 30);
    const u = seg(t, frac(ctx, 0, 0.3), frac(ctx, 0, 0.75), ease.linear), n = Math.round(u * G.length);
    c.querySelector('.m').innerHTML = `<span style="color:#f87171">${G.slice(0, n)}</span>${u < 1 ? P.slice(Math.min(P.length, Math.round(u * P.length))) : ''}`;
  });
}
/* SERVER */
{
  const c = $('#sv-c'); c.innerHTML = `<div class="k">🖥️ WHATSAPP SERVER</div><div style="margin-top:14px;font:700 30px/1.5 'JetBrains Mono'"><div>content: <span style="color:#f87171">x9#Fq2!kP@7$Lm4…</span> 🤷</div><div>to: <span style="color:#86efac">Riya · +91 ••••• 4821</span></div><div>route: <span style="color:#93c5fd">→ India</span></div></div>`;
  FV.scene('server', (t, ctx) => { kb(ctx.el, t, ctx.dur, 1.05, 1.16); routeScene('server', t, ctx); enter(c, t, 0.3, 0.45, 30); });
}
/* CABLE: light pulses travel along the cable direction */
{
  const c = $('#cb-c'); c.innerHTML = `<div class="k" style="color:#7dd3fc">🌊 FIBRE-OPTIC CABLE · OCEAN FLOOR</div><div style="margin-top:10px;font:800 40px Inter">you are now <span style="color:#7dd3fc">light</span> ✨</div>`;
  const L = $('#cb-l'); const pulses = Array.from({ length: 6 }, () => div('', '', L, 'position:absolute;width:26px;height:26px;border-radius:50%;background:#e0f2fe;box-shadow:0 0 30px 12px #38bdf8;opacity:0'));
  FV.scene('cable', (t, ctx) => {
    kb(ctx.el, t, ctx.dur, 1.02, 1.12); routeScene('cable', t, ctx); enter(c, t, 0.3, 0.45, 30);
    pulses.forEach((p, i) => { const u = ((t * 0.6 + i / 6) % 1); const x = lerp(140, 980, u), y = lerp(1720, 1150, u); p.style.left = x + 'px'; p.style.top = y + 'px'; p.style.opacity = t > 0.4 ? (1 - u) * 0.9 : 0; p.style.transform = `scale(${1.4 - u})`; });
  });
}
/* LAND */
{
  const c = $('#ld-c'); c.innerHTML = `<div class="k" style="color:#fdba74">🏖️ CABLE LANDING STATION</div><div style="margin-top:10px;font:800 40px Inter">back on land, in India 🇮🇳</div>`;
  FV.scene('land', (t, ctx) => { kb(ctx.el, t, ctx.dur, 1.06, 1.14); routeScene('land', t, ctx); enter(c, t, 0.3, 0.45, 30); });
}
/* CITY */
{
  const c = $('#ct-c'); c.innerHTML = `<div class="k" style="color:#fde68a">🌆 MUMBAI · 9:00 AM</div><div style="margin-top:10px;font:800 40px Inter">📡 Indian network → her tower</div>`;
  FV.scene('city', (t, ctx) => { kb(ctx.el, t, ctx.dur, 1.04, 1.12); routeScene('city', t, ctx); enter(c, t, 0.3, 0.45, 30); });
}
/* ARRIVE: unlocked bubble + blue ticks */
{
  const c = $('#ar-c'); c.innerHTML = `<div class="k" style="color:#94a3b8">💬 AARAV</div><div style="margin-top:12px"><span style="display:inline-block;padding:18px 24px;border-radius:24px 24px 24px 6px;background:#202c33;font:600 36px Inter">Happy birthday Riya!! 🎂🎉</span></div><div class="tk" style="margin-top:12px;text-align:right;font:800 28px Inter"></div>`;
  FV.scene('arrive', (t, ctx) => {
    kb(ctx.el, t, ctx.dur, 1.02, 1.08); routeScene('arrive', t, ctx); pop(c, t, 0.4, 0.45);
    const b = t > frac(ctx, 0, 0.7); const tk = c.querySelector('.tk'); tk.textContent = '✓✓ ' + (b ? 'Read' : 'Delivered'); tk.style.color = b ? '#53bdeb' : '#94a3b8';
  });
}
/* OUTRO */
FV.scene('outro', (t, ctx) => {
  kb(ctx.el, t, ctx.dur, 1.12, 1.18); dim(ctx.el, 0.35); R.style.opacity = 1 - seg(t, 0, 0.4); setRoute(5);
  pop($('#oc-a'), t, ctx.line(0) - 0.1, 0.45); pop($('#oc-b'), t, ctx.line(1) - 0.1, 0.45);
});

})();
</script>
</body>
</html>
