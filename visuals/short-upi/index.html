<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UPI Short</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#eef2f6;--mut:#94a3b8;--acc:#fb923c;--acc2:#fdba74;--grn:#34d399;--red:#f87171;--yel:#fbbf24;--pk:#f472b6;--cy:#22d3ee}
  #fv-stage{background:radial-gradient(1000px 1300px at 70% 15%,#3a1f12 0%,#1a1220 50%,#0a0a12 80%);color:var(--ink);font-family:Inter,system-ui,sans-serif}
  #bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(251,146,60,.11) 1px,transparent 1px),linear-gradient(90deg,rgba(251,146,60,.11) 1px,transparent 1px);background-size:90px 90px;opacity:.22}
  .abs{position:absolute}
  .step{position:absolute;left:0;right:0;top:250px;text-align:center;font:700 34px/1 'JetBrains Mono',monospace;letter-spacing:.2em;color:var(--acc2)}
  .head{position:absolute;left:60px;right:60px;top:305px;text-align:center;font:800 84px/1.05 Inter;letter-spacing:-.03em}
  .mono{font-family:'JetBrains Mono',monospace}
  .badge{position:absolute;left:50%;top:150px;transform:translateX(-50%);padding:12px 26px;border-radius:40px;background:color-mix(in srgb,var(--acc) 12%,transparent);border:2px solid color-mix(in srgb,var(--acc) 55%,transparent);font:700 30px Inter;color:var(--acc2);white-space:nowrap}
  .pill{display:inline-block;padding:12px 26px;border-radius:40px;font:800 32px Inter}
  .pane{position:absolute;left:120px;width:840px;height:765px;border-radius:26px;overflow:hidden;border:3px solid color-mix(in srgb,var(--acc) 45%,transparent);background:rgba(8,8,16,.75)}
  .pane svg{position:absolute;inset:0;width:840px;height:765px}
  .below{position:absolute;left:0;right:0;top:1225px;text-align:center}
  .big{font:900 120px/1 Inter;letter-spacing:-.04em;color:#fff}
  .card{border-radius:22px;padding:26px 30px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.14)}
  .fv-endcard{display:inline-block;padding:16px 30px;border-radius:40px;font:700 34px 'JetBrains Mono',monospace;border:3px solid #eef2f6;background:rgba(238,242,246,.08)}
</style>
</head>
<body>
<div id="fv-stage">
  <div id="bg-grid"></div>
  <div class="badge">⚙️ Backend · Tech, decoded</div>
<section class="fv-scene" data-scene="hook"><div class="pane" id="hk-p" style="top:300px"></div><div id="hk-q" class="abs" style="left:0;right:0;top:1110px;text-align:center"><div class="big">⚡ <span style="color:var(--acc2)">UPI</span></div></div></section>
<section class="fv-scene" data-scene="request"><div class="step">STEP 1</div><div class="head">Your app asks NPCI</div><div class="pane" id="rq-p" style="top:430px"></div><div class="below" id="rq-t"></div></section>
<section class="fv-scene" data-scene="route"><div class="step">STEP 2</div><div class="head">Who is riya@okbank?</div><div class="pane" id="ro-p" style="top:430px"></div><div class="below" id="ro-t"></div></section>
<section class="fv-scene" data-scene="debit"><div class="step">STEP 3</div><div class="head">Your bank: PIN + debit</div><div class="pane" id="de-p" style="top:430px"></div><div class="below" id="de-t"></div></section>
<section class="fv-scene" data-scene="credit"><div class="step">STEP 4</div><div class="head">Their bank: credit</div><div class="pane" id="cr-p" style="top:430px"></div><div class="below" id="cr-t"></div></section>
<section class="fv-scene" data-scene="outro"><div id="oc-w" class="abs" style="left:40px;right:40px;top:640px;display:grid;justify-items:center;gap:22px"></div></section>
</div>
<script src="timing.js"></script>
<script src="fv-runtime.js"></script>
<script>
(() => {
const { seg, css, enter, lerp, clamp, ease, pulse, $ } = FV;
const NS = 'http://www.w3.org/2000/svg';
const svgEl = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const txt = (s, x, y, str, o = {}) => { const e = svgEl('text', Object.assign({ x, y, fill: '#eef2f6', 'font-size': 30, 'font-weight': 700, 'font-family': 'Inter', 'text-anchor': 'middle' }, o), s); e.textContent = str; return e; };
const div = (cls, html, parent, style) => { const e = document.createElement('div'); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; if (style) e.style.cssText = style; if (parent) parent.appendChild(e); return e; };
const pop = (el, t, a, d = 0.45) => { const p = seg(t, a, a + d, ease.back); css(el, { o: clamp(p * 1.5), s: Math.max(0, p) }); return p; };
const head = (el, t) => { const s = el.querySelector('.step'), h = el.querySelector('.head'); if (s) enter(s, t, 0.0, 0.4); if (h) enter(h, t, 0.08, 0.45, 30); };
const frac = (ctx, i, f) => ctx.line(i) + (ctx.lineEnd(i) - ctx.line(i)) * f;
const pill = (t, c) => `<span class="pill" style="border:3px solid ${c};background:${c}1a;color:${c}">${t}</span>`;
const show = (el, html) => { if (el.__h !== html) { el.innerHTML = html; el.__h = html; } };

function flowPane(host) { return svgEl('svg', { viewBox: '0 0 840 765' }, host); }
function node(s, x, y, w, h, title, sub, c) {
  const g = svgEl('g', { opacity: 0 }, s);
  const r = svgEl('rect', { x: x - w / 2, y: y - h / 2, width: w, height: h, rx: 18, fill: '#0f172a', stroke: c, 'stroke-width': 4 }, g);
  txt(g, x, y + (sub ? -4 : 10), title, { 'font-size': 30, 'font-weight': 800, fill: '#f1f5f9' });
  if (sub) txt(g, x, y + 30, sub, { 'font-size': 22, fill: '#94a3b8', 'font-family': 'JetBrains Mono' });
  return { g, r, x, y, w, h, c };
}
function link(s, a, b, c = '#64748b') { return svgEl('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: c, 'stroke-width': 4, 'stroke-dasharray': '10 10', opacity: 0 }, s); }
function packet(s, label, c) {
  const g = svgEl('g', { opacity: 0 }, s);
  const w = Math.max(90, label.length * 15 + 34);
  svgEl('rect', { x: -w / 2, y: -24, width: w, height: 48, rx: 24, fill: c }, g);
  txt(g, 0, 9, label, { 'font-size': 24, 'font-weight': 800, fill: '#0b1020', 'font-family': 'JetBrains Mono' });
  return g;
}
function move(p, a, b, u) { if (u <= 0 || u >= 1) { p.setAttribute('opacity', 0); return; } p.setAttribute('opacity', 1); p.setAttribute('transform', `translate(${lerp(a.x, b.x, ease.inOut(u))} ${lerp(a.y, b.y, ease.inOut(u))})`); }

/* shared diagram: you, NPCI, your bank, their bank, them */
function diagram(host) {
  const s = flowPane(host);
  const N = {
    you: node(s, 170, 120, 260, 110, '📱 your app', 'GPay / PhonePe', '#fb923c'),
    npci: node(s, 420, 380, 280, 120, '🔀 NPCI', 'the UPI switch', '#2dd4bf'),
    yb: node(s, 170, 650, 260, 110, '🏦 your bank', 'checks PIN', '#a78bfa'),
    tb: node(s, 670, 650, 260, 110, '🏦 their bank', 'OK Bank', '#34d399'),
    them: node(s, 670, 120, 260, 110, '📱 riya', 'riya@okbank', '#f472b6'),
  };
  const L = { you: link(s, N.you, N.npci), yb: link(s, N.npci, N.yb), tb: link(s, N.npci, N.tb), them: link(s, N.npci, N.them) };
  return { s, N, L };
}
const showAll = (D, keys, o = 1) => keys.forEach((k) => { D.N[k].g.setAttribute('opacity', o); if (D.L[k]) D.L[k].setAttribute('opacity', o); });
/* HOOK: scan, PIN, paid, timer */
{
  const host = $('#hk-p');
  host.innerHTML = `<div style="position:absolute;left:250px;top:30px;width:340px;height:700px;border-radius:44px;background:#111827;border:6px solid #374151;overflow:hidden;color:#f1f5f9;font-family:Inter">
    <div class="a1" style="position:absolute;inset:0;display:grid;place-items:center"><div style="text-align:center"><div style="font-size:150px">🔳</div><div style="font:700 28px Inter;color:#94a3b8">scan QR</div></div></div>
    <div class="a2" style="position:absolute;inset:0;padding:60px 30px;opacity:0;text-align:center"><div style="font:700 28px Inter;color:#94a3b8">Paying riya@okbank</div><div style="font:900 70px Inter;margin:18px 0">₹500</div><div style="font:700 26px Inter;color:#94a3b8">enter UPI PIN</div><div class="pin" style="margin-top:20px;font-size:48px;letter-spacing:12px"></div></div>
    <div class="a3" style="position:absolute;inset:0;display:grid;place-items:center;background:#065f46;opacity:0"><div style="text-align:center"><div style="font-size:120px">✅</div><div style="font:900 52px Inter">₹500 paid</div></div></div></div>
    <div class="tm mono" style="position:absolute;right:40px;top:40px;font-size:44px;font-weight:800;color:#2dd4bf"></div>`;
  FV.scene('hook', (t, ctx) => {
    enter(host, t, 0.05, 0.4, 20);
    const a2 = seg(t, 1.0, 1.3), a3 = seg(t, frac(ctx, 0, 0.55), frac(ctx, 0, 0.62));
    host.querySelector('.a1').style.opacity = 1 - a2; host.querySelector('.a2').style.opacity = a2 * (1 - a3); host.querySelector('.a3').style.opacity = a3;
    host.querySelector('.pin').textContent = '●'.repeat(Math.round(seg(t, 1.6, frac(ctx, 0, 0.35), ease.linear) * 6));
    const tm = seg(t, frac(ctx, 0, 0.35), frac(ctx, 0, 0.55), ease.linear) * 2;
    host.querySelector('.tm').textContent = t > frac(ctx, 0, 0.35) ? `⏱ ${tm.toFixed(1)} s` : '';
    pop($('#hk-q'), t, ctx.line(1) - 0.1, 0.5);
  });
}
/* REQUEST */
{
  const D = diagram($('#rq-p')), p = packet(D.s, 'pay ₹500 → riya@okbank', '#fb923c');
  FV.scene('request', (t, ctx) => {
    head(ctx.el, t); enter($('#rq-p'), t, 0.1, 0.4, 20);
    showAll(D, ['you']); showAll(D, ['npci'], seg(t, frac(ctx, 0, 0.45), frac(ctx, 0, 0.6))); showAll(D, ['yb', 'tb', 'them'], 0.15);
    move(p, D.N.you, D.N.npci, seg(t, frac(ctx, 0, 0.6), frac(ctx, 0, 0.9), ease.linear));
    show($('#rq-t'), pill("your app doesn't move the money", '#fb923c')); $('#rq-t').style.opacity = seg(t, 0.4, 0.7);
  });
}
/* ROUTE: lookup */
{
  const D = diagram($('#ro-p'));
  const tab = svgEl('g', { opacity: 0 }, D.s); svgEl('rect', { x: 250, y: 470, width: 340, height: 100, rx: 14, fill: '#022c22', stroke: '#2dd4bf', 'stroke-width': 3 }, tab);
  txt(tab, 420, 510, 'riya@okbank → OK Bank', { 'font-size': 24, 'font-family': 'JetBrains Mono', fill: '#5eead4' }); txt(tab, 420, 548, 'account ••4821', { 'font-size': 24, 'font-family': 'JetBrains Mono', fill: '#94a3b8' });
  FV.scene('route', (t, ctx) => {
    head(ctx.el, t); enter($('#ro-p'), t, 0.1, 0.4, 20);
    showAll(D, ['you', 'npci']); showAll(D, ['yb'], 0.15); showAll(D, ['tb', 'them'], 0.15 + 0.85 * seg(t, frac(ctx, 0, 0.6), frac(ctx, 0, 0.8)));
    tab.setAttribute('opacity', seg(t, frac(ctx, 0, 0.15), frac(ctx, 0, 0.35)));
    D.N.npci.r.setAttribute('stroke-width', 4 + 4 * pulse(t, frac(ctx, 0, 0.1), frac(ctx, 0, 0.6)));
    show($('#ro-t'), pill('UPI ID → bank + account', '#2dd4bf')); $('#ro-t').style.opacity = seg(t, 0.4, 0.7);
  });
}
/* DEBIT */
{
  const D = diagram($('#de-p')), p = packet(D.s, 'PIN ✓? debit ₹500', '#a78bfa');
  const bal = txt(D.s, 175, 570, '', { 'font-size': 26, 'font-family': 'JetBrains Mono', fill: '#f87171' });
  FV.scene('debit', (t, ctx) => {
    head(ctx.el, t); enter($('#de-p'), t, 0.1, 0.4, 20);
    showAll(D, ['you', 'npci', 'tb', 'them']); showAll(D, ['yb'], seg(t, 0.2, 0.6));
    move(p, D.N.npci, D.N.yb, seg(t, frac(ctx, 0, 0.1), frac(ctx, 0, 0.5), ease.linear));
    const d = t > frac(ctx, 0, 0.6); bal.textContent = d ? '₹12,340 → ₹11,840 ✓' : '';
    show($('#de-t'), pill('your bank verifies the PIN, not the app', '#a78bfa')); $('#de-t').style.opacity = seg(t, 0.4, 0.7);
  });
}
/* CREDIT */
{
  const D = diagram($('#cr-p')), p = packet(D.s, 'credit ₹500', '#34d399');
  const ok1 = packet(D.s, '✓ paid', '#fb923c'), ok2 = packet(D.s, '✓ ₹500 received', '#f472b6');
  const tm = txt(D.s, 420, 270, '', { 'font-size': 40, 'font-weight': 900, fill: '#2dd4bf', 'font-family': 'JetBrains Mono' });
  FV.scene('credit', (t, ctx) => {
    head(ctx.el, t); enter($('#cr-p'), t, 0.1, 0.4, 20);
    showAll(D, ['you', 'npci', 'yb', 'tb', 'them']);
    move(p, D.N.npci, D.N.tb, seg(t, frac(ctx, 0, 0.05), frac(ctx, 0, 0.35), ease.linear));
    const c = seg(t, frac(ctx, 0, 0.45), frac(ctx, 0, 0.75), ease.linear);
    move(ok1, D.N.npci, D.N.you, c); move(ok2, D.N.npci, D.N.them, c);
    tm.textContent = t > frac(ctx, 0, 0.8) ? '⏱ ~2 seconds' : '';
    show($('#cr-t'), pill('both phones get a confirmation', '#34d399')); $('#cr-t').style.opacity = seg(t, 0.4, 0.7);
  });
}
/* OUTRO */
{
  const Wd = [['Your app, NPCI,', '#fb923c', 0], ['two banks.', '#a78bfa', 0.3], ['Two seconds.', '#2dd4bf', 0.6]];
  const w = Wd.map(([s, c]) => div('', s, $('#oc-w'), `font:900 92px/1.05 Inter;letter-spacing:-.03em;color:${c};text-align:center`));
  FV.scene('outro', (t, ctx) => w.forEach((e, i) => pop(e, t, frac(ctx, 0, Wd[i][2]), 0.4)));
}

})();
</script>
</body>
</html>
