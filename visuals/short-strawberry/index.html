<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strawberry Short</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#eef2f6;--mut:#94a3b8;--acc:#6366f1;--acc2:#a5b4fc;--grn:#34d399;--red:#f87171;--yel:#fbbf24;--pk:#f472b6;--cy:#22d3ee}
  #fv-stage{background:radial-gradient(1000px 1300px at 70% 15%,#1e1b5e 0%,#0f0f2e 50%,#07071a 80%);color:var(--ink);font-family:Inter,system-ui,sans-serif}
  #bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(99,102,241,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(99,102,241,.13) 1px,transparent 1px);background-size:90px 90px;opacity:.22}
  .abs{position:absolute}
  .step{position:absolute;left:0;right:0;top:250px;text-align:center;font:700 34px/1 'JetBrains Mono',monospace;letter-spacing:.2em;color:var(--acc2)}
  .head{position:absolute;left:60px;right:60px;top:305px;text-align:center;font:800 84px/1.05 Inter;letter-spacing:-.03em}
  .mono{font-family:'JetBrains Mono',monospace}
  .badge{position:absolute;left:50%;top:150px;transform:translateX(-50%);padding:12px 26px;border-radius:40px;background:color-mix(in srgb,var(--acc) 12%,transparent);border:2px solid color-mix(in srgb,var(--acc) 55%,transparent);font:700 30px Inter;color:var(--acc2);white-space:nowrap}
  .pill{display:inline-block;padding:12px 26px;border-radius:40px;font:800 32px Inter}
  .pane{position:absolute;left:120px;width:840px;height:765px;border-radius:26px;overflow:hidden;border:3px solid color-mix(in srgb,var(--acc) 45%,transparent);background:rgba(8,8,16,.75)}
  .pane svg{position:absolute;inset:0;width:840px;height:765px}
  .below{position:absolute;left:0;right:0;top:1225px;text-align:center}
  .big{font:900 120px/1 Inter;letter-spacing:-.04em;color:#fff}
  .card{border-radius:22px;padding:26px 30px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.14)}
  .fv-endcard{display:inline-block;padding:16px 30px;border-radius:40px;font:700 34px 'JetBrains Mono',monospace;border:3px solid #eef2f6;background:rgba(238,242,246,.08)}
</style>
</head>
<body>
<div id="fv-stage">
  <div id="bg-grid"></div>
  <div class="badge">🧠 AI · Tech, decoded</div>
<section class="fv-scene" data-scene="hook"><div id="hk-c" class="abs" style="left:90px;right:90px;top:330px"></div><div id="hk-q" class="abs" style="left:0;right:0;top:1060px;text-align:center"><div class="big" style="font-size:96px">Why does it <span style="color:#f87171">fail?</span> 🍓</div></div></section>
<section class="fv-scene" data-scene="tokens"><div class="step">STEP 1</div><div class="head">Chopped into tokens</div><div id="tk-c" class="abs" style="left:60px;right:60px;top:520px;text-align:center"></div><div class="below" id="tk-t"></div></section>
<section class="fv-scene" data-scene="numbers"><div class="step">STEP 2</div><div class="head">Tokens → numbers</div><div id="nm-c" class="abs" style="left:60px;right:60px;top:520px;text-align:center"></div><div class="below" id="nm-t"></div></section>
<section class="fv-scene" data-scene="why"><div class="step">THE PROBLEM</div><div class="head">Letters are hidden</div><div id="wy-c" class="abs" style="left:90px;right:90px;top:470px"></div></section>
<section class="fv-scene" data-scene="fix"><div class="step">THE FIX</div><div class="head">Spell it out</div><div id="fx-c" class="abs" style="left:60px;right:60px;top:480px;text-align:center"></div></section>
<section class="fv-scene" data-scene="outro"><div id="oc-w" class="abs" style="left:40px;right:40px;top:620px;display:grid;justify-items:center;gap:22px"></div></section>
</div>
<script src="timing.js"></script>
<script src="fv-runtime.js"></script>
<script>
(() => {
const { seg, css, enter, lerp, clamp, ease, pulse, $ } = FV;
const NS = 'http://www.w3.org/2000/svg';
const svgEl = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const txt = (s, x, y, str, o = {}) => { const e = svgEl('text', Object.assign({ x, y, fill: '#eef2f6', 'font-size': 30, 'font-weight': 700, 'font-family': 'Inter', 'text-anchor': 'middle' }, o), s); e.textContent = str; return e; };
const div = (cls, html, parent, style) => { const e = document.createElement('div'); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; if (style) e.style.cssText = style; if (parent) parent.appendChild(e); return e; };
const pop = (el, t, a, d = 0.45) => { const p = seg(t, a, a + d, ease.back); css(el, { o: clamp(p * 1.5), s: Math.max(0, p) }); return p; };
const head = (el, t) => { const s = el.querySelector('.step'), h = el.querySelector('.head'); if (s) enter(s, t, 0.0, 0.4); if (h) enter(h, t, 0.08, 0.45, 30); };
const frac = (ctx, i, f) => ctx.line(i) + (ctx.lineEnd(i) - ctx.line(i)) * f;
const pill = (t, c) => `<span class="pill" style="border:3px solid ${c};background:${c}1a;color:${c}">${t}</span>`;
const show = (el, html) => { if (el.__h !== html) { el.innerHTML = html; el.__h = html; } };

const TOK = [['str', '#f472b6', 496], ['aw', '#fbbf24', 675], ['berry', '#34d399', 15717]];
const chip = (s, c, size = 96) => `<span class="ch" style="display:inline-block;margin:0 10px;padding:14px 26px;border-radius:22px;border:4px solid ${c};background:${c}22;color:#fff;font:800 ${size}px 'JetBrains Mono';transition:none">${s}</span>`;
/* HOOK: chat exchange */
{
  const c = $('#hk-c');
  c.innerHTML = `<div class="q" style="margin-left:auto;width:max-content;max-width:760px;padding:24px 30px;border-radius:30px 30px 6px 30px;background:#4f46e5;font:600 40px Inter">How many R's are in "strawberry"? 🍓</div>
   <div class="a" style="margin-top:30px;width:max-content;max-width:760px;padding:24px 30px;border-radius:30px 30px 30px 6px;background:#1e1b4b;border:2px solid #4338ca;font:600 40px Inter">🤖 There are <b>2</b> R's in "strawberry".</div>
   <div class="w" style="margin-top:44px;text-align:center;font:800 88px 'JetBrains Mono';letter-spacing:6px"></div>`;
  const W = 'strawberry'; c.querySelector('.w').innerHTML = [...W].map((l) => `<span class="L" style="color:#e2e8f0">${l}</span>`).join('');
  FV.scene('hook', (t, ctx) => {
    enter(c.querySelector('.q'), t, 0.3, 0.4, 20); enter(c.querySelector('.a'), t, frac(ctx, 0, 0.3), 0.4, 20);
    const w = c.querySelector('.w'); w.style.opacity = seg(t, frac(ctx, 0, 0.75), frac(ctx, 0, 0.85));
    let n = 0; w.querySelectorAll('.L').forEach((s, i) => { if (W[i] === 'r') { n++; const on = t > ctx.line(1) + n * 0.25 - 0.4; s.style.color = on ? '#f87171' : '#e2e8f0'; s.style.textShadow = on ? '0 0 24px #f87171' : 'none'; } });
    pop($('#hk-q'), t, ctx.line(1) + 0.6, 0.5);
  });
}
/* TOKENS: the word splits into three chunks */
{
  const c = $('#tk-c'); c.innerHTML = `<div class="w" style="font:800 110px 'JetBrains Mono';letter-spacing:4px">strawberry</div><div class="ks" style="margin-top:20px">${TOK.map(([s, col]) => chip(s, col)).join('')}</div>`;
  const ks = c.querySelectorAll('.ch');
  FV.scene('tokens', (t, ctx) => {
    head(ctx.el, t);
    const sp = seg(t, frac(ctx, 0, 0.45), frac(ctx, 0, 0.6), ease.inOut); c.querySelector('.w').style.opacity = 1 - sp; c.querySelector('.w').style.transform = `translateY(${sp * 60}px)`;
    ks.forEach((k, i) => pop(k, t, frac(ctx, 0, 0.55 + i * 0.12), 0.45));
    c.querySelector('.ks').style.transform = `translateY(${-140 * sp + 140}px)`;
    show($('#tk-t'), pill('"strawberry" = 3 tokens', '#a5b4fc')); $('#tk-t').style.opacity = seg(t, frac(ctx, 0, 0.85), frac(ctx, 0, 0.95));
  });
}
/* NUMBERS: chips flip to IDs; model box only sees numbers */
{
  const c = $('#nm-c');
  c.innerHTML = `<div class="ks">${TOK.map(([s, col]) => chip(s, col, 80)).join('')}</div><div style="margin:30px 0;font:800 70px Inter;color:#a5b4fc">⬇</div>
    <div class="ns">${TOK.map(([, col, id]) => `<span class="n" style="display:inline-block;margin:0 10px;padding:14px 24px;border-radius:18px;background:#0b1020;border:3px solid ${col};font:800 64px 'JetBrains Mono';color:${col}">${id}</span>`).join('')}</div>
    <div class="m" style="margin:50px auto 0;width:640px;padding:30px;border-radius:26px;background:#1e1b4b;border:3px solid #6366f1;font:800 44px Inter">🤖 the model sees:<div style="margin-top:14px;font:800 52px 'JetBrains Mono';color:#c7d2fe">[ ${TOK.map((x) => x[2]).join(', ')} ]</div></div>`;
  const ns = c.querySelectorAll('.n');
  FV.scene('numbers', (t, ctx) => {
    head(ctx.el, t); enter(c.querySelector('.ks'), t, 0.15, 0.4, 20);
    ns.forEach((n, i) => pop(n, t, frac(ctx, 0, 0.2 + i * 0.1), 0.45));
    enter(c.querySelector('.m'), t, frac(ctx, 0, 0.6), 0.45, 30);
    show($('#nm-t'), pill('no letters anywhere', '#f87171')); $('#nm-t').style.opacity = seg(t, frac(ctx, 0, 0.85), frac(ctx, 0, 0.95));
  });
}
/* WHY: dictionary page analogy */
{
  const c = $('#wy-c');
  c.innerHTML = `<div class="card" style="padding:40px;text-align:center;border-color:#a5b4fc66"><div style="font:700 34px Inter;color:#a5b4fc">How many R's in this word?</div>
    <div style="margin:30px auto;width:520px;padding:40px 0;border-radius:22px;background:#f8fafc;color:#0f172a;box-shadow:0 10px 40px rgba(0,0,0,.4)"><div style="font:800 34px Inter;color:#64748b">📖 Dictionary</div><div class="pg" style="font:900 80px 'JetBrains Mono';white-space:nowrap">p. 15717</div></div>
    <div class="q" style="font:800 46px Inter;color:#fbbf24">🤔 You'd have to open the page!</div></div>
    <div class="h" style="margin-top:34px;display:flex;justify-content:center;gap:12px">${'berry'.split('').map((l) => `<span class="hl" style="width:84px;height:100px;border-radius:14px;background:#1e293b;border:3px dashed #475569;display:grid;place-items:center;font:800 56px 'JetBrains Mono';color:#475569">?</span>`).join('')}</div>`;
  FV.scene('why', (t, ctx) => {
    head(ctx.el, t); enter(c.querySelector('.card'), t, 0.15, 0.45, 30);
    c.querySelector('.q').style.opacity = seg(t, frac(ctx, 0, 0.6), frac(ctx, 0, 0.7));
    c.querySelectorAll('.hl').forEach((h, i) => pop(h, t, frac(ctx, 0, 0.3) + i * 0.1, 0.4));
  });
}
/* FIX: letter by letter + code */
{
  const c = $('#fx-c'); const W = 'strawberry';
  c.innerHTML = `<div class="ls" style="display:flex;justify-content:center;gap:8px">${[...W].map((l) => `<div class="lt" style="width:80px;padding:18px 0;border-radius:14px;background:#1e1b4b;border:3px solid #4338ca;font:800 54px 'JetBrains Mono'">${l}<div class="ct" style="font:800 26px Inter;color:#34d399;height:32px"></div></div>`).join('')}</div>
    <div class="code card mono" style="margin:60px auto 0;width:max-content;padding:28px 40px;font-size:44px;background:#0b1020;text-align:left">"strawberry".count("r")<br><span style="color:#34d399">→ 3 ✅</span></div>`;
  const lts = c.querySelectorAll('.lt');
  FV.scene('fix', (t, ctx) => {
    head(ctx.el, t); let n = 0;
    lts.forEach((l, i) => { pop(l, t, frac(ctx, 0, 0.05) + i * 0.15, 0.3); if (W[i] === 'r') { n++; const on = t > frac(ctx, 0, 0.05) + i * 0.15 + 0.3; l.style.borderColor = on ? '#34d399' : '#4338ca'; l.querySelector('.ct').textContent = on ? n : ''; } });
    enter(c.querySelector('.code'), t, frac(ctx, 0, 0.6), 0.45, 30);
  });
}
/* OUTRO */
{
  const Wd = [['It reads tokens,', '#a5b4fc', 0], ['not letters.', '#f472b6', 0.25], ['🍓 = 3 R\'s', '#34d399', 0.55]];
  const w = Wd.map(([s, c]) => div('', s, $('#oc-w'), `font:900 100px/1.06 Inter;letter-spacing:-.03em;color:${c};text-align:center`));
  FV.scene('outro', (t, ctx) => w.forEach((e, i) => pop(e, t, i < 2 ? frac(ctx, 0, Wd[i][2] * 2) : ctx.line(1), 0.45)));
}

})();
</script>
</body>
</html>
