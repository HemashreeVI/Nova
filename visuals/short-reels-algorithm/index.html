<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reels algorithm Short</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#eef2f6;--mut:#94a3b8;--acc:#6366f1;--acc2:#a5b4fc;--grn:#34d399;--red:#f87171;--yel:#fbbf24;--pk:#f472b6;--cy:#22d3ee}
  #fv-stage{background:radial-gradient(1000px 1300px at 70% 15%,#1e1b5e 0%,#0f0f2e 50%,#07071a 80%);color:var(--ink);font-family:Inter,system-ui,sans-serif}
  #bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(99,102,241,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(99,102,241,.13) 1px,transparent 1px);background-size:90px 90px;opacity:.22}
  .abs{position:absolute}
  .step{position:absolute;left:0;right:0;top:250px;text-align:center;font:700 34px/1 'JetBrains Mono',monospace;letter-spacing:.2em;color:var(--acc2)}
  .head{position:absolute;left:60px;right:60px;top:305px;text-align:center;font:800 84px/1.05 Inter;letter-spacing:-.03em}
  .mono{font-family:'JetBrains Mono',monospace}
  .badge{position:absolute;left:50%;top:150px;transform:translateX(-50%);padding:12px 26px;border-radius:40px;background:color-mix(in srgb,var(--acc) 12%,transparent);border:2px solid color-mix(in srgb,var(--acc) 55%,transparent);font:700 30px Inter;color:var(--acc2);white-space:nowrap}
  .pill{display:inline-block;padding:12px 26px;border-radius:40px;font:800 32px Inter}
  .pane{position:absolute;left:120px;width:840px;height:765px;border-radius:26px;overflow:hidden;border:3px solid color-mix(in srgb,var(--acc) 45%,transparent);background:rgba(8,8,16,.75)}
  .pane svg{position:absolute;inset:0;width:840px;height:765px}
  .below{position:absolute;left:0;right:0;top:1225px;text-align:center}
  .big{font:900 120px/1 Inter;letter-spacing:-.04em;color:#fff}
  .card{border-radius:22px;padding:26px 30px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.14)}
  .fv-endcard{display:inline-block;padding:16px 30px;border-radius:40px;font:700 34px 'JetBrains Mono',monospace;border:3px solid #eef2f6;background:rgba(238,242,246,.08)}
</style>
</head>
<body>
<div id="fv-stage">
  <div id="bg-grid"></div>
  <div class="badge">🧠 AI · Tech, decoded</div>
<section class="fv-scene" data-scene="hook"><div class="pane" id="hk-p" style="top:300px"></div><div id="hk-q" class="abs" style="left:0;right:0;top:1110px;text-align:center"><div class="big" style="font-size:100px">📱 The <span style="color:var(--acc2)">algorithm</span></div></div></section>
<section class="fv-scene" data-scene="pool"><div class="step">STEP 1</div><div class="head">Gather candidates</div><div class="pane" id="po-p" style="top:430px"></div><div class="below" id="po-t"></div></section>
<section class="fv-scene" data-scene="signals"><div class="step">STEP 2</div><div class="head">Predict what you’ll do</div><div class="pane" id="si-p" style="top:430px"></div><div class="below" id="si-t"></div></section>
<section class="fv-scene" data-scene="score"><div class="step">STEP 3</div><div class="head">Highest score first</div><div class="pane" id="sc-p" style="top:430px"></div><div class="below" id="sc-t"></div></section>
<section class="fv-scene" data-scene="learn"><div class="step">STEP 4</div><div class="head">Every swipe teaches it</div><div class="pane" id="le-p" style="top:430px"></div><div class="below" id="le-t"></div></section>
<section class="fv-scene" data-scene="outro"><div id="oc-w" class="abs" style="left:40px;right:40px;top:640px;display:grid;justify-items:center;gap:22px"></div></section>
</div>
<script src="timing.js"></script>
<script src="fv-runtime.js"></script>
<script>
(() => {
const { seg, css, enter, lerp, clamp, ease, pulse, $ } = FV;
const NS = 'http://www.w3.org/2000/svg';
const svgEl = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const txt = (s, x, y, str, o = {}) => { const e = svgEl('text', Object.assign({ x, y, fill: '#eef2f6', 'font-size': 30, 'font-weight': 700, 'font-family': 'Inter', 'text-anchor': 'middle' }, o), s); e.textContent = str; return e; };
const div = (cls, html, parent, style) => { const e = document.createElement('div'); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; if (style) e.style.cssText = style; if (parent) parent.appendChild(e); return e; };
const pop = (el, t, a, d = 0.45) => { const p = seg(t, a, a + d, ease.back); css(el, { o: clamp(p * 1.5), s: Math.max(0, p) }); return p; };
const head = (el, t) => { const s = el.querySelector('.step'), h = el.querySelector('.head'); if (s) enter(s, t, 0.0, 0.4); if (h) enter(h, t, 0.08, 0.45, 30); };
const frac = (ctx, i, f) => ctx.line(i) + (ctx.lineEnd(i) - ctx.line(i)) * f;
const pill = (t, c) => `<span class="pill" style="border:3px solid ${c};background:${c}1a;color:${c}">${t}</span>`;
const show = (el, html) => { if (el.__h !== html) { el.innerHTML = html; el.__h = html; } };

const R = [['🍜', 'street food', '#f97316'], ['🏏', 'cricket', '#22c55e'], ['🐶', 'puppies', '#eab308'], ['💻', 'coding', '#6366f1'], ['💄', 'makeup', '#ec4899'], ['🎮', 'gaming', '#06b6d4']];
const reel = (e, n, c, w = 220) => `<div style="width:${w}px;height:${w * 1.6}px;border-radius:22px;background:linear-gradient(160deg,${c},#111827);display:grid;place-items:center;position:relative"><div style="font-size:${w * 0.4}px">${e}</div><div style="position:absolute;left:14px;bottom:12px;font:700 ${w * 0.1}px Inter">${n}</div></div>`;
/* HOOK: phone opens on a perfect reel */
{
  const host = $('#hk-p');
  host.innerHTML = `<div style="position:absolute;left:250px;top:24px;width:340px;height:710px;border-radius:44px;background:#000;border:6px solid #374151;overflow:hidden"><div class="r" style="position:absolute;inset:0;display:grid;place-items:center;opacity:0">${reel('🍜', 'street food', '#f97316', 300)}</div><div class="h" style="position:absolute;right:20px;bottom:120px;font-size:64px;opacity:0">❤️</div></div>`;
  FV.scene('hook', (t, ctx) => {
    enter(host, t, 0.05, 0.4, 20);
    host.querySelector('.r').style.opacity = seg(t, 0.6, 1.0); pop(host.querySelector('.h'), t, frac(ctx, 0, 0.7), 0.4);
    pop($('#hk-q'), t, ctx.line(1) - 0.1, 0.5);
  });
}
/* POOL: thousands -> a few hundred */
{
  const host = $('#po-p'); host.innerHTML = '<div class="g" style="position:absolute;inset:30px 30px 130px;display:grid;grid-template-columns:repeat(20,1fr);gap:5px"></div><div class="c mono" style="position:absolute;left:0;right:0;bottom:40px;text-align:center;font-size:40px;font-weight:800"></div>';
  const cells = Array.from({ length: 200 }, (_, i) => div('', '', host.querySelector('.g'), `aspect-ratio:9/16;border-radius:4px;background:${R[i % 6][2]};opacity:.7`));
  FV.scene('pool', (t, ctx) => {
    head(ctx.el, t); enter(host, t, 0.1, 0.4, 20);
    const k = seg(t, frac(ctx, 0, 0.35), frac(ctx, 0, 0.75));
    cells.forEach((c, i) => { const keep = (i * 37) % 200 < 200 * (1 - 0.88 * k); c.style.opacity = keep ? 0.85 : 0.08; });
    const c = host.querySelector('.c'); c.textContent = `${Math.round(lerp(10000, 500, k)).toLocaleString('en-US')} reels`; c.style.color = k > 0.9 ? '#34d399' : '#e5e7eb';
    show($('#po-t'), pill('from people you follow + people like you', '#a5b4fc')); $('#po-t').style.opacity = seg(t, 0.4, 0.7);
  });
}
/* SIGNALS: predicted actions for one reel */
{
  const host = $('#si-p'); const S = [['👀 watch to the end', 72, '#22d3ee'], ['❤️ like', 31, '#f472b6'], ['📤 send to a friend', 12, '#34d399'], ['🔖 save', 8, '#fbbf24']];
  host.innerHTML = `<div style="position:absolute;left:40px;top:60px">${reel('🏏', 'cricket', '#22c55e', 230)}</div><div class="b" style="position:absolute;left:310px;right:40px;top:90px;display:grid;gap:34px"></div>`;
  const bars = S.map(([l, v, c]) => { const r = div('', `<div style="font:700 28px Inter;color:#e5e7eb">${l}</div><div style="margin-top:8px;display:flex;align-items:center;gap:12px"><div style="flex:1;height:26px;border-radius:13px;background:rgba(255,255,255,.08)"><div class="f" style="height:100%;width:0;border-radius:13px;background:${c}"></div></div><div class="mono p" style="width:70px;font-size:26px;color:${c}"></div></div>`, host.querySelector('.b')); return { r, v }; });
  FV.scene('signals', (t, ctx) => {
    head(ctx.el, t); enter(host, t, 0.1, 0.4, 20);
    bars.forEach((b, i) => { const g = seg(t, frac(ctx, 0, 0.15 + i * 0.15), frac(ctx, 0, 0.35 + i * 0.15)); b.r.querySelector('.f').style.width = b.v * g + '%'; b.r.querySelector('.p').textContent = g > 0 ? Math.round(b.v * g) + '%' : ''; });
    show($('#si-t'), pill('predictions, for you specifically', '#a5b4fc')); $('#si-t').style.opacity = seg(t, 0.4, 0.7);
  });
}
/* SCORE: inputs, then a ranked list */
{
  const host = $('#sc-p'); const L = [['🍜', 'street food', 0.91], ['💻', 'coding', 0.84], ['🏏', 'cricket', 0.62], ['🐶', 'puppies', 0.55], ['🎮', 'gaming', 0.21]];
  host.innerHTML = `<div class="in" style="position:absolute;left:30px;right:30px;top:30px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap"></div><div class="l" style="position:absolute;left:60px;right:60px;top:170px;display:grid;gap:18px"></div>`;
  const ins = ['🕘 your past activity', '🎬 about the reel', '🤝 you & the creator'].map((s, i) => div('', s, host.querySelector('.in'), 'padding:12px 20px;border-radius:30px;background:rgba(165,180,252,.12);border:2px solid #a5b4fc66;font:700 24px Inter;color:#c7d2fe;opacity:0'));
  const rows = L.map(([e, n, sc], i) => div('', `<div style="display:flex;align-items:center;gap:18px;padding:14px 20px;border-radius:16px;background:${i === 0 ? 'rgba(52,211,153,.15)' : 'rgba(255,255,255,.05)'};border:2px solid ${i === 0 ? '#34d399' : 'transparent'}"><span style="font-size:44px">${e}</span><span style="flex:1;font:700 32px Inter">${n}</span><span class="mono" style="font-size:30px;color:${i === 0 ? '#34d399' : '#94a3b8'}">${sc.toFixed(2)}</span>${i === 0 ? '<span style="font:800 24px Inter;color:#34d399">→ your feed</span>' : ''}</div>`, host.querySelector('.l')));
  FV.scene('score', (t, ctx) => {
    head(ctx.el, t); enter(host, t, 0.1, 0.4, 20);
    ins.forEach((c, i) => c.style.opacity = seg(t, frac(ctx, 0, 0.05 + i * 0.12), frac(ctx, 0, 0.15 + i * 0.12)));
    rows.forEach((r, i) => enter(r, t, frac(ctx, 0, 0.55 + i * 0.07), 0.4, 20));
    show($('#sc-t'), pill('sorted by predicted score', '#34d399')); $('#sc-t').style.opacity = seg(t, frac(ctx, 0, 0.6), frac(ctx, 0, 0.75));
  });
}
/* LEARN: quick skip lowers a topic */
{
  const host = $('#le-p');
  host.innerHTML = `<div class="ph" style="position:absolute;left:60px;top:40px">${reel('🎮', 'gaming', '#06b6d4', 260)}</div><div class="sw" style="position:absolute;left:120px;top:250px;font-size:80px;opacity:0">👆</div>
    <div style="position:absolute;left:400px;right:40px;top:120px"><div style="font:800 30px Inter;color:#e5e7eb">🎮 gaming</div><div style="margin-top:12px;height:30px;border-radius:15px;background:rgba(255,255,255,.08)"><div class="f" style="height:100%;width:70%;border-radius:15px;background:#06b6d4"></div></div><div class="mono n" style="margin-top:10px;font-size:26px;color:#94a3b8"></div>
    <div class="s" style="margin-top:40px;font:800 34px Inter;color:#f87171;opacity:0">skipped in 1 s</div></div>`;
  FV.scene('learn', (t, ctx) => {
    head(ctx.el, t); enter(host, t, 0.1, 0.4, 20);
    const sw = seg(t, frac(ctx, 0, 0.3), frac(ctx, 0, 0.5), ease.inOut);
    host.querySelector('.sw').style.opacity = pulse(t, frac(ctx, 0, 0.25), frac(ctx, 0, 0.55)); host.querySelector('.sw').style.transform = `translateY(${-sw * 200}px)`;
    host.querySelector('.ph').style.transform = `translateY(${-sw * 500}px)`; host.querySelector('.ph').style.opacity = 1 - sw;
    host.querySelector('.s').style.opacity = seg(t, frac(ctx, 0, 0.5), frac(ctx, 0, 0.6));
    const d = seg(t, frac(ctx, 0, 0.6), frac(ctx, 0, 0.85)); host.querySelector('.f').style.width = (70 - 45 * d) + '%'; host.querySelector('.n').textContent = `interest ${(0.7 - 0.45 * d).toFixed(2)}`;
    show($('#le-t'), pill('less of that next time', '#f87171')); $('#le-t').style.opacity = seg(t, frac(ctx, 0, 0.7), frac(ctx, 0, 0.85));
  });
}
/* OUTRO */
{
  const Wd = [['Predict what you’ll watch.', '#a5b4fc', 0], ['Show that first.', '#34d399', 0.5]];
  const w = Wd.map(([s, c]) => div('', s, $('#oc-w'), `font:900 88px/1.08 Inter;letter-spacing:-.03em;color:${c};text-align:center`));
  FV.scene('outro', (t, ctx) => w.forEach((e, i) => pop(e, t, frac(ctx, 0, Wd[i][2]), 0.45)));
}

})();
</script>
</body>
</html>
