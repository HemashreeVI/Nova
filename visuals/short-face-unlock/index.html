<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Face unlock Short</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#eef2f6;--mut:#94a3b8;--acc:#06b6d4;--acc2:#67e8f9;--grn:#34d399;--red:#f87171;--yel:#fbbf24;--pk:#f472b6;--cy:#22d3ee}
  #fv-stage{background:radial-gradient(1000px 1300px at 70% 15%,#073345 0%,#071825 50%,#040a12 80%);color:var(--ink);font-family:Inter,system-ui,sans-serif}
  #bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(6,182,212,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(6,182,212,.12) 1px,transparent 1px);background-size:90px 90px;opacity:.22}
  .abs{position:absolute}
  .step{position:absolute;left:0;right:0;top:250px;text-align:center;font:700 34px/1 'JetBrains Mono',monospace;letter-spacing:.2em;color:var(--acc2)}
  .head{position:absolute;left:60px;right:60px;top:305px;text-align:center;font:800 84px/1.05 Inter;letter-spacing:-.03em}
  .mono{font-family:'JetBrains Mono',monospace}
  .badge{position:absolute;left:50%;top:150px;transform:translateX(-50%);padding:12px 26px;border-radius:40px;background:color-mix(in srgb,var(--acc) 12%,transparent);border:2px solid color-mix(in srgb,var(--acc) 55%,transparent);font:700 30px Inter;color:var(--acc2);white-space:nowrap}
  .pill{display:inline-block;padding:12px 26px;border-radius:40px;font:800 32px Inter}
  .pane{position:absolute;left:120px;width:840px;height:765px;border-radius:26px;overflow:hidden;border:3px solid color-mix(in srgb,var(--acc) 45%,transparent);background:rgba(8,8,16,.75)}
  .pane svg{position:absolute;inset:0;width:840px;height:765px}
  .below{position:absolute;left:0;right:0;top:1225px;text-align:center}
  .big{font:900 120px/1 Inter;letter-spacing:-.04em;color:#fff}
  .card{border-radius:22px;padding:26px 30px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.14)}
  .fv-endcard{display:inline-block;padding:16px 30px;border-radius:40px;font:700 34px 'JetBrains Mono',monospace;border:3px solid #eef2f6;background:rgba(238,242,246,.08)}
</style>
</head>
<body>
<div id="fv-stage">
  <div id="bg-grid"></div>
  <div class="badge">👁️ Computer Vision · Tech, decoded</div>
<section class="fv-scene" data-scene="hook"><div class="pane" id="hk-p" style="top:300px"></div><div id="hk-q" class="abs" style="left:0;right:0;top:1110px;text-align:center"><div class="big" style="font-size:100px">🔓 Face <span style="color:var(--acc2)">unlock</span></div></div></section>
<section class="fv-scene" data-scene="dots"><div class="step">STEP 1</div><div class="head">Invisible dots</div><div class="pane" id="dt-p" style="top:430px"></div><div class="below" id="dt-t"></div></section>
<section class="fv-scene" data-scene="depth"><div class="step">STEP 2</div><div class="head">A 3D depth map</div><div class="pane" id="dp-p" style="top:430px"></div><div class="below" id="dp-t"></div></section>
<section class="fv-scene" data-scene="match"><div class="step">STEP 3</div><div class="head">Match the numbers</div><div class="pane" id="mt-p" style="top:430px"></div><div class="below" id="mt-t"></div></section>
<section class="fv-scene" data-scene="photo"><div class="step">WHY PHOTOS FAIL</div><div class="head">No depth, no match</div><div class="pane" id="ph-p" style="top:430px"></div><div class="below" id="ph-t"></div></section>
<section class="fv-scene" data-scene="outro"><div id="oc-w" class="abs" style="left:40px;right:40px;top:660px;display:grid;justify-items:center;gap:22px"></div></section>
</div>
<script src="timing.js"></script>
<script src="fv-runtime.js"></script>
<script>
(() => {
const { seg, css, enter, lerp, clamp, ease, pulse, $ } = FV;
const NS = 'http://www.w3.org/2000/svg';
const svgEl = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const txt = (s, x, y, str, o = {}) => { const e = svgEl('text', Object.assign({ x, y, fill: '#eef2f6', 'font-size': 30, 'font-weight': 700, 'font-family': 'Inter', 'text-anchor': 'middle' }, o), s); e.textContent = str; return e; };
const div = (cls, html, parent, style) => { const e = document.createElement('div'); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; if (style) e.style.cssText = style; if (parent) parent.appendChild(e); return e; };
const pop = (el, t, a, d = 0.45) => { const p = seg(t, a, a + d, ease.back); css(el, { o: clamp(p * 1.5), s: Math.max(0, p) }); return p; };
const head = (el, t) => { const s = el.querySelector('.step'), h = el.querySelector('.head'); if (s) enter(s, t, 0.0, 0.4); if (h) enter(h, t, 0.08, 0.45, 30); };
const frac = (ctx, i, f) => ctx.line(i) + (ctx.lineEnd(i) - ctx.line(i)) * f;
const pill = (t, c) => `<span class="pill" style="border:3px solid ${c};background:${c}1a;color:${c}">${t}</span>`;
const show = (el, html) => { if (el.__h !== html) { el.innerHTML = html; el.__h = html; } };

/* a stylised face as an ellipse grid; z = depth (nose forward) */
const FX = 420, FY = 380, RX = 210, RY = 270;
const depth = (x, y) => { const u = (x - FX) / RX, v = (y - FY) / RY, r = u * u + v * v; if (r > 1) return null;
  let z = Math.sqrt(1 - r) * 0.7; z += 0.35 * Math.exp(-((u) ** 2 / 0.02 + (v + 0.05) ** 2 / 0.08)); // nose
  z -= 0.12 * (Math.exp(-((u - 0.38) ** 2 + (v + 0.25) ** 2) / 0.02) + Math.exp(-((u + 0.38) ** 2 + (v + 0.25) ** 2) / 0.02)); // eye sockets
  return z; };
const DOTS = []; for (let y = FY - RY; y <= FY + RY; y += 18) for (let x = FX - RX; x <= FX + RX; x += 18) { const z = depth(x, y); if (z !== null) DOTS.push({ x, y, z }); }
function face(host, o = {}) {
  const s = svgEl('svg', { viewBox: '0 0 840 765' }, host);
  const sk = svgEl('ellipse', { cx: FX, cy: FY, rx: RX, ry: RY, fill: '#c08457', opacity: o.skin ?? 0.9 }, s);
  const fe = svgEl('g', { opacity: o.skin ?? 0.9 }, s);
  [[-80], [80]].forEach(([dx]) => { svgEl('ellipse', { cx: FX + dx, cy: FY - 60, rx: 30, ry: 16, fill: '#fff' }, fe); svgEl('circle', { cx: FX + dx, cy: FY - 60, r: 12, fill: '#1f2937' }, fe); });
  svgEl('path', { d: `M ${FX} ${FY - 40} L ${FX - 22} ${FY + 50} L ${FX + 10} ${FY + 54}`, fill: 'none', stroke: '#7c4a2d', 'stroke-width': 6 }, fe);
  svgEl('path', { d: `M ${FX - 70} ${FY + 120} Q ${FX} ${FY + 160} ${FX + 70} ${FY + 120}`, fill: 'none', stroke: '#7c2d12', 'stroke-width': 8, 'stroke-linecap': 'round' }, fe);
  const dg = svgEl('g', {}, s);
  const D = DOTS.map((d) => svgEl('circle', { cx: d.x, cy: d.y, r: 3.6, fill: '#f43f5e', opacity: 0 }, dg));
  return { s, sk, fe, D };
}
const heat = (z) => `hsl(${200 - z * 200},90%,${45 + z * 15}%)`;
/* HOOK: dark room, glance, padlock opens */
{
  const host = $('#hk-p'), F = face(host, { skin: 0.35 });
  host.insertAdjacentHTML('beforeend', '<div id="hk-l" style="position:absolute;left:0;right:0;top:640px;text-align:center;font-size:90px">🔒</div><div id="hk-ph" style="position:absolute;inset:0;display:grid;place-items:center;font:900 54px Inter;color:#f87171;opacity:0;background:rgba(0,0,0,.55)">🖼️ photo → ✗ locked</div>');
  FV.scene('hook', (t, ctx) => {
    enter(host, t, 0.05, 0.4, 20);
    const sc = seg(t, 0.6, 2.2, ease.linear); F.D.forEach((d, i) => d.setAttribute('opacity', (i / F.D.length) < sc ? 0.8 * (1 - seg(t, 2.4, 2.9)) : 0));
    $('#hk-l').textContent = t > 2.6 ? '🔓' : '🔒';
    $('#hk-ph').style.opacity = seg(t, frac(ctx, 0, 0.72), frac(ctx, 0, 0.82));
    pop($('#hk-q'), t, ctx.line(1) - 0.1, 0.5);
  });
}
/* DOTS: projector sprays a grid */
{
  const host = $('#dt-p'), F = face(host, { skin: 0.5 });
  const proj = svgEl('g', {}, F.s); svgEl('rect', { x: 380, y: 700, width: 80, height: 36, rx: 10, fill: '#334155', stroke: '#94a3b8', 'stroke-width': 3 }, proj); txt(proj, 420, 760, 'IR projector', { 'font-size': 20, fill: '#94a3b8' });
  const beam = svgEl('polygon', { points: '400,700 440,700 640,110 200,110', fill: '#f43f5e', opacity: 0 }, F.s);
  FV.scene('dots', (t, ctx) => {
    head(ctx.el, t); enter(host, t, 0.1, 0.4, 20);
    const u = seg(t, frac(ctx, 0, 0.15), frac(ctx, 0, 0.85), ease.linear);
    beam.setAttribute('opacity', 0.08 * pulse(t, frac(ctx, 0, 0.1), frac(ctx, 0, 0.95)));
    F.D.forEach((d, i) => d.setAttribute('opacity', (i * 0.618) % 1 < u ? 0.95 : 0));
    show($('#dt-t'), pill(`${Math.round(u * 30000).toLocaleString('en-US')} infrared dots`, '#f43f5e')); $('#dt-t').style.opacity = seg(t, 0.4, 0.7);
  });
}
/* DEPTH: dots shift with depth, colour by distance */
{
  const host = $('#dp-p'), F = face(host, { skin: 0.15 });
  FV.scene('depth', (t, ctx) => {
    head(ctx.el, t); enter(host, t, 0.1, 0.4, 20);
    const u = seg(t, frac(ctx, 0, 0.25), frac(ctx, 0, 0.7), ease.inOut), rot = Math.sin(t * 0.9) * 0.35 * u;
    F.D.forEach((e, i) => { const d = DOTS[i]; const x = FX + (d.x - FX) * Math.cos(rot) + d.z * 260 * Math.sin(rot); e.setAttribute('cx', x); e.setAttribute('opacity', 1); e.setAttribute('fill', u > 0.05 ? heat(d.z * u + (1 - u) * 0.5) : '#f43f5e'); e.setAttribute('r', 3.6 + d.z * 2.5 * u); });
    F.fe.setAttribute('opacity', 0.15 * (1 - u));
    show($('#dp-t'), pill('🔴 close · 🔵 far: the shape of YOUR face', '#22d3ee')); $('#dp-t').style.opacity = seg(t, frac(ctx, 0, 0.5), frac(ctx, 0, 0.6));
  });
}
/* MATCH: map -> numbers -> compare with secure chip */
{
  const host = $('#mt-p'); const vec = (k) => Array.from({ length: 6 }, (_, i) => (Math.sin(i * 2.7 + k) * 0.9).toFixed(2));
  const a = vec(1), b = vec(1.04);
  host.innerHTML = `<div style="position:absolute;inset:0;padding:44px;font-family:'JetBrains Mono'">
    <div style="font:800 28px Inter;color:#94a3b8">your face right now</div><div class="mono va" style="margin-top:10px;font-size:30px;color:#67e8f9"></div>
    <div style="margin-top:60px;font:800 28px Inter;color:#94a3b8">🔐 stored in the secure chip</div><div class="mono vb" style="margin-top:10px;font-size:30px;color:#a5b4fc"></div>
    <div class="res" style="margin-top:70px;text-align:center;font:900 64px Inter;color:#34d399;opacity:0">✓ 99.8% match → 🔓</div></div>`;
  FV.scene('match', (t, ctx) => {
    head(ctx.el, t); enter(host, t, 0.1, 0.4, 20);
    const n = Math.round(seg(t, frac(ctx, 0, 0.1), frac(ctx, 0, 0.45), ease.linear) * 6);
    host.querySelector('.va').textContent = '[' + a.slice(0, n).join(', ') + (n < 6 ? ' …' : '') + ']';
    host.querySelector('.vb').textContent = t > frac(ctx, 0, 0.5) ? '[' + b.join(', ') + ']' : '';
    host.querySelector('.res').style.opacity = seg(t, frac(ctx, 0, 0.8), frac(ctx, 0, 0.9));
    show($('#mt-t'), pill('the face never leaves your phone', '#34d399')); $('#mt-t').style.opacity = seg(t, frac(ctx, 0, 0.85), frac(ctx, 0, 0.95));
  });
}
/* PHOTO: flat dots, all one colour */
{
  const host = $('#ph-p'), F = face(host, { skin: 0.5 });
  host.insertAdjacentHTML('beforeend', '<div id="ph-x" style="position:absolute;right:30px;top:30px;padding:10px 22px;border-radius:30px;background:#ef4444;color:#fff;font:900 34px Inter;opacity:0">✗ FLAT → LOCKED</div>');
  FV.scene('photo', (t, ctx) => {
    head(ctx.el, t); enter(host, t, 0.1, 0.4, 20);
    const u = seg(t, frac(ctx, 0, 0.1), frac(ctx, 0, 0.4));
    F.D.forEach((e) => { e.setAttribute('opacity', u); e.setAttribute('fill', heat(0.5)); });
    F.s.style.transform = `perspective(900px) rotateY(${Math.sin(t * 1.3) * 25}deg)`;
    $('#ph-x').style.opacity = seg(t, frac(ctx, 0, 0.5), frac(ctx, 0, 0.6));
    show($('#ph-t'), pill('a photo is the same distance everywhere', '#f87171')); $('#ph-t').style.opacity = seg(t, 0.4, 0.7);
  });
}
/* OUTRO */
{
  const Wd = [['Not a photo.', '#f87171', 0], ['A 3D map of your face.', '#67e8f9', 0.35]];
  const w = Wd.map(([s, c]) => div('', s, $('#oc-w'), `font:900 88px/1.05 Inter;letter-spacing:-.03em;color:${c};text-align:center`));
  FV.scene('outro', (t, ctx) => w.forEach((e, i) => pop(e, t, frac(ctx, 0, Wd[i][2]), 0.4)));
}

})();
</script>
</body>
</html>
