<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kafka Short</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#eef0f6;--mut:#9aa1b8;--o:#f97316;--o2:#fb923c;--blu:#60a5fa;--grn:#34d399;--red:#f87171;--pur:#a78bfa;--pink:#f472b6;--yel:#fbbf24}
  #fv-stage{background:radial-gradient(1000px 1300px at 70% 15%,#2b1a10 0%,#151220 50%,#09080f 80%);color:var(--ink);font-family:Inter,system-ui,sans-serif}
  #bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(249,115,22,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(249,115,22,.12) 1px,transparent 1px);background-size:90px 90px;opacity:.22}
  .abs{position:absolute}
  .step{position:absolute;left:0;right:0;top:250px;text-align:center;font:700 34px/1 'JetBrains Mono',monospace;letter-spacing:.2em;color:var(--o2)}
  .head{position:absolute;left:60px;right:60px;top:305px;text-align:center;font:800 84px/1.05 Inter;letter-spacing:-.03em}
  .panel{position:absolute;border:3px solid rgba(230,190,160,.25);border-radius:26px;background:rgba(22,16,24,.93)}
  .mono{font-family:'JetBrains Mono',monospace}
  .label{font:600 28px Inter;color:var(--mut)}
  .badge{position:absolute;left:50%;top:150px;transform:translateX(-50%);padding:12px 26px;border-radius:40px;background:rgba(249,115,22,.12);border:2px solid rgba(249,115,22,.5);font:700 30px Inter;color:var(--o2);white-space:nowrap}
  .pill{display:inline-block;padding:12px 28px;border-radius:40px;font:800 36px Inter}
  .svc{position:absolute;width:200px;height:96px;margin-left:-100px;margin-top:-48px;border-radius:20px;border:3px solid var(--cc);background:color-mix(in srgb,var(--cc) 14%,#151220);display:flex;align-items:center;justify-content:center;gap:10px;font:800 28px Inter}
  .ev{position:absolute;width:74px;height:74px;margin-left:-37px;margin-top:-37px;border-radius:14px;display:flex;align-items:center;justify-content:center;font:800 24px 'JetBrains Mono';color:#160b03;box-sizing:border-box}
  .log{position:absolute;height:110px;border-radius:20px;border:3px solid rgba(249,115,22,.55);background:rgba(249,115,22,.06)}
  .tag{position:absolute;font:800 28px 'JetBrains Mono'}
  .fv-endcard{display:inline-block;padding:16px 30px;border-radius:40px;font:700 34px 'JetBrains Mono',monospace;border:3px solid #eef0f6;background:rgba(238,240,246,.08)}
</style>
</head>
<body>
<div id="fv-stage">
  <div id="bg-grid"></div>
  <div class="badge">⚙️ Backend · Tech, decoded</div>

  <!-- HOOK -->
  <section class="fv-scene" data-scene="hook">
    <div id="hk-icons" class="abs" style="left:0;right:0;top:330px;display:flex;justify-content:center;gap:50px"></div>
    <svg id="hk-svg" class="abs" width="1080" height="1920" style="inset:0"></svg>
    <div id="hk-evs"></div>
    <div id="hk-k" class="abs" style="left:0;right:0;top:820px;text-align:center">
      <div style="font:900 170px/1 Inter;letter-spacing:-.05em;color:#fff;text-shadow:0 0 60px rgba(249,115,22,.9)">Kafka</div>
      <div id="hk-rate" class="mono" style="font-size:46px;font-weight:800;color:var(--o2);margin-top:18px"></div>
    </div>
  </section>

  <!-- PROBLEM -->
  <section class="fv-scene" data-scene="problem">
    <div class="step">THE PROBLEM</div><div class="head">Spaghetti wiring</div>
    <svg id="pb-svg" class="abs" width="1080" height="1920" style="inset:0"></svg>
    <div id="pb-host"></div>
    <div id="pb-n" class="abs" style="left:0;right:0;top:1180px;text-align:center"></div>
  </section>

  <!-- TOPIC -->
  <section class="fv-scene" data-scene="topic">
    <div class="step">STEP 1</div><div class="head">Topics</div>
    <div id="tp-prods" class="abs" style="left:0;right:0;top:0"></div>
    <div id="tp-name" class="abs mono" style="left:60px;top:690px;font-size:30px;font-weight:800;color:var(--o2)">topic: "rides"  · append-only log</div>
    <div id="tp-log" class="log" style="left:60px;right:60px;top:740px"></div>
    <div id="tp-evs"></div>
    <div id="tp-arrow" class="abs mono" style="left:0;right:0;top:880px;text-align:center;font-size:30px;font-weight:700;color:var(--mut)">new events always go on the end →</div>
    <div id="tp-off" class="abs" style="left:0;right:0;top:960px;text-align:center"><span class="pill mono" style="font-size:32px;border:3px solid var(--yel);color:var(--yel);background:rgba(251,191,36,.1)">0, 1, 2, 3… = offsets</span></div>
  </section>

  <!-- PARTITIONS -->
  <section class="fv-scene" data-scene="partitions">
    <div class="step">STEP 2</div><div class="head">Partitions</div>
    <div id="pt-host"></div>
  </section>

  <!-- CONSUMERS -->
  <section class="fv-scene" data-scene="consumers">
    <div class="step">STEP 3</div><div class="head">Consumers</div>
    <div id="cs-host"></div>
  </section>

  <!-- DURABLE -->
  <section class="fv-scene" data-scene="durable">
    <div class="step">THE SUPERPOWER</div><div class="head">Nothing is lost</div>
    <div id="du-host"></div>
  </section>

  <!-- OUTRO -->
  <section class="fv-scene" data-scene="outro">
    <div id="oc-h" class="abs" style="left:60px;right:60px;top:300px;text-align:center;font:900 96px/1.08 Inter;letter-spacing:-.04em">Write once.<br><span style="color:var(--o2)">Read by many.</span></div>
    <div id="oc-list" class="abs" style="left:0;right:0;top:580px;display:flex;flex-direction:column;align-items:center;gap:12px"></div>
    <div id="oc-gh" class="abs" style="left:0;right:0;top:1150px;text-align:center"><span class="fv-endcard"></span></div>
  </section>
</div>
<script src="timing.js"></script>
<script src="fv-runtime.js"></script>
<script>
(() => {
const { seg, css, enter, lerp, clamp, ease, pulse, rand, $ } = FV;
const NS = 'http://www.w3.org/2000/svg';
const svg = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const div = (cls, html, parent, style) => { const e = document.createElement('div'); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; if (style) e.style.cssText = style; if (parent) parent.appendChild(e); return e; };
const pop = (el, t, a, d = 0.45) => { const p = seg(t, a, a + d, ease.back); if (el instanceof SVGElement) { el.setAttribute('opacity', clamp(p * 1.5)); } else css(el, { o: clamp(p * 1.5), s: Math.max(0, p) }); return p; };
const head = (el, t) => { enter($('.step', el), t, 0.0, 0.4); enter($('.head', el), t, 0.08, 0.45, 30); };
const frac = (ctx, i, f) => ctx.line(i) + (ctx.lineEnd(i) - ctx.line(i)) * f;
const O = '#f97316', O2 = '#fb923c', BLU = '#60a5fa', GRN = '#34d399', RED = '#f87171', PUR = '#a78bfa', PINK = '#f472b6', YEL = '#fbbf24';
const EVC = [O2, YEL, PINK, BLU, GRN, PUR];
const ev = (parent, label, c) => { const e = div('ev', label, parent); e.style.background = c; return e; };
const place = (e, x, y, o = 1, s = 1) => css(e, { left: x + 'px', top: y + 'px', o, s });

/* HOOK */
{
  const I = [['🚗', 'ride'], ['👆', 'click'], ['💳', 'payment']];
  const icons = I.map(([ic, w]) => div('', `<div style="font-size:90px;line-height:1">${ic}</div><div style="font:800 32px Inter;margin-top:8px">${w}</div>`, $('#hk-icons'), 'text-align:center'));
  const xs = [330, 540, 750];
  const sv = $('#hk-svg');
  xs.forEach((x) => svg('path', { d: `M${x} 520 C${x} 650 540 650 540 790`, stroke: 'rgba(249,115,22,.4)', 'stroke-width': 5, fill: 'none', 'stroke-dasharray': '12 10' }, sv));
  const r = rand(5);
  const evs = Array.from({ length: 18 }, (_, i) => ({ e: ev($('#hk-evs'), '', EVC[i % 6]), k: i % 3, o: r() }));
  FV.scene('hook', (t, ctx) => {
    icons.forEach((e, i) => pop(e, t, frac(ctx, 0, 0.12 + i * 0.12), 0.4));
    sv.style.opacity = seg(t, frac(ctx, 0, 0.5), frac(ctx, 0, 0.7));
    const go = frac(ctx, 0, 0.6), sp = 1 + 2.5 * seg(t, ctx.line(1), ctx.line(1) + 2);
    evs.forEach((v) => {
      const ph = ((t - go) * 0.7 * sp + v.o) % 1;
      const x = xs[v.k], p = ease.inOut(ph);
      place(v.e, lerp(x, 540, p), lerp(540, 790, p), t > go ? clamp(ph * 6) * clamp((1 - ph) * 6) : 0, 0.55);
    });
    pop($('#hk-k'), t, ctx.line(1) - 0.1, 0.5);
    $('#hk-rate').textContent = `${Math.round(2000000 * seg(t, ctx.line(1) + 0.3, ctx.dur - 0.4, ease.in)).toLocaleString('en-US')} events / sec`;
  });
}

/* PROBLEM */
{
  const N = [['Rides', 270, 520], ['Payments', 810, 520], ['Maps', 160, 800], ['Alerts', 920, 800], ['Analytics', 270, 1080], ['Billing', 810, 1080], ['Fraud', 540, 640]];
  const cs = [BLU, GRN, PUR, PINK, YEL, O2, RED];
  const sv = $('#pb-svg');
  const lines = [];
  for (let i = 0; i < N.length; i++) for (let j = i + 1; j < N.length; j++) lines.push({ j: Math.max(i, j), el: svg('line', { x1: N[i][1], y1: N[i][2], x2: N[j][1], y2: N[j][2], stroke: RED, 'stroke-width': 3 }, sv) });
  const nodes = N.map(([n, x, y], i) => { const e = div('svc', n, $('#pb-host'), `left:${x}px;top:${y}px`); e.style.setProperty('--cc', cs[i]); return e; });
  FV.scene('problem', (t, ctx) => {
    head(ctx.el, t);
    const add = [0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.72].map((f) => frac(ctx, 0, f));
    let shown = 0;
    nodes.forEach((n, i) => { pop(n, t, add[i], 0.4); if (t > add[i]) shown = i + 1; });
    lines.forEach((l) => l.el.setAttribute('opacity', l.j < shown ? 0.55 : 0));
    const c = (shown * (shown - 1)) / 2;
    $('#pb-n').innerHTML = shown ? `<span class="pill mono" style="font-size:36px;border:3px solid ${RED};color:${RED};background:rgba(248,113,113,.1)">${shown} services → ${c} connections</span>` : '';
    css($('#pb-n'), { s: 1 + 0.15 * pulse(t, add[6], add[6] + 0.6) });
  });
}

/* TOPIC */
{
  const P = [['🚗 ride app', 300], ['💳 payments', 780]];
  const prods = P.map(([n, x]) => { const e = div('svc', n, $('#tp-prods'), `left:${x}px;top:520px;width:300px;margin-left:-150px`); e.style.setProperty('--cc', BLU); return e; });
  const evs = Array.from({ length: 8 }, (_, i) => ev($('#tp-evs'), i, EVC[i % 6]));
  FV.scene('topic', (t, ctx) => {
    head(ctx.el, t);
    prods.forEach((e, i) => enter(e, t, frac(ctx, 0, 0.05) + i * 0.1, 0.4, 20));
    enter($('#tp-name'), t, frac(ctx, 0, 0.25), 0.4, 0);
    enter($('#tp-log'), t, frac(ctx, 0, 0.25), 0.4, 0);
    const s0 = frac(ctx, 0, 0.32), dt = 0.42;
    evs.forEach((e, i) => {
      const a = s0 + i * dt, p = seg(t, a, a + 0.5, ease.inOut);
      const sx = P[i % 2][1], tx = 120 + i * 120;
      place(e, lerp(sx, tx, p), lerp(570, 795, p) - Math.sin(p * Math.PI) * 30, seg(t, a - 0.1, a));
    });
    enter($('#tp-arrow'), t, frac(ctx, 0, 0.45), 0.4, 0);
    pop($('#tp-off'), t, frac(ctx, 0, 0.82), 0.45);
  });
}

/* PARTITIONS */
{
  const host = $('#pt-host');
  const B = [['Broker 1', BLU], ['Broker 2', GRN], ['Broker 3', PUR]];
  const prod = div('svc', '🚗 producer', host, 'left:540px;top:500px;width:300px;margin-left:-150px'); prod.style.setProperty('--cc', BLU);
  const rows = B.map(([b, c], i) => {
    const y = 650 + i * 190;
    const lg = div('log', '', host, `left:250px;right:60px;top:${y}px`);
    const bl = div('tag', `${b}<br><span style="color:${c};font-size:24px">partition ${i}</span>`, host, `left:40px;top:${y + 18}px;font-size:26px;line-height:1.3`);
    return { lg, bl, y };
  });
  const r = rand(11);
  const evs = Array.from({ length: 15 }, (_, i) => ({ e: ev(host, '', EVC[i % 6]), p: i % 3, k: Math.floor(i / 3) }));
  FV.scene('partitions', (t, ctx) => {
    head(ctx.el, t);
    enter(prod, t, 0.15, 0.4, 20);
    rows.forEach((x, i) => { enter(x.lg, t, frac(ctx, 0, 0.25) + i * 0.1, 0.4, 0); enter(x.bl, t, frac(ctx, 0, 0.25) + i * 0.1, 0.4, 0); });
    const s0 = frac(ctx, 0, 0.45);
    evs.forEach((v) => {
      const a = s0 + v.k * 0.5 + v.p * 0.05, p = seg(t, a, a + 0.55, ease.inOut);   // parallel: same k = same time
      const tx = 330 + v.k * 120, ty = rows[v.p].y + 55;
      place(v.e, lerp(540, tx, p), lerp(560, ty, p), seg(t, a - 0.1, a), 0.85);
    });
    rows.forEach((x, i) => (x.lg.style.boxShadow = `0 0 ${30 * pulse(t, s0, ctx.dur)}px rgba(249,115,22,.5)`));
  });
}

/* CONSUMERS */
{
  const host = $('#cs-host');
  const rows = [0, 1, 2].map((i) => {
    const y = 470 + i * 150;
    const lg = div('log', '', host, `left:180px;right:60px;top:${y}px;height:100px`);
    div('tag', `P${i}`, host, `left:80px;top:${y + 30}px;color:${O2}`);
    const evs = Array.from({ length: 6 }, (_, k) => ev(host, '', EVC[(k + i) % 6]));
    evs.forEach((e, k) => place(e, 260 + k * 110, y + 50, 1, 0.8));
    const ptr = div('', '▲', host, `position:absolute;top:${y + 102}px;font:900 34px Inter;color:${YEL};margin-left:-14px`);
    return { lg, evs, ptr, y };
  });
  const grp = div('panel', '', host, 'left:80px;right:80px;top:960px;height:240px');
  div('label', 'consumer group: "billing"', grp, 'position:absolute;left:26px;top:16px;color:#fbbf24');
  const C = [['C1', 'P0', 200], ['C2', 'P1', 470], ['C3', 'P2', 740]];
  const cons = C.map(([n, p, x], i) => { const e = div('svc', `${n} <span style="font-size:22px;color:#9aa1b8">← ${p}</span>`, host, `left:${x + 60}px;top:1100px`); e.style.setProperty('--cc', [BLU, GRN, PUR][i]); return e; });
  const speeds = [1.1, 0.7, 0.9];
  FV.scene('consumers', (t, ctx) => {
    head(ctx.el, t);
    rows.forEach((r, i) => { enter(r.lg, t, 0.15 + i * 0.08, 0.4, 0); r.evs.forEach((e) => (e.style.opacity = seg(t, 0.2 + i * 0.08, 0.6 + i * 0.08))); });
    const s0 = frac(ctx, 0, 0.12);
    rows.forEach((r, i) => {
      const off = Math.min(5, Math.floor(Math.max(0, t - s0) * speeds[i] * 0.9));
      r.ptr.style.left = `${260 + off * 110}px`;
      r.ptr.style.opacity = seg(t, s0, s0 + 0.3);
      r.evs.forEach((e, k) => (e.style.filter = k < off ? 'grayscale(.8) brightness(.6)' : ''));
    });
    const g = frac(ctx, 0, 0.5);
    enter(grp, t, g, 0.4, 20);
    cons.forEach((c, i) => pop(c, t, g + 0.3 + i * 0.12, 0.4));
  });
}

/* DURABLE */
{
  const host = $('#du-host');
  const B = [['Broker 1', 260], ['Broker 2', 540], ['Broker 3', 820]];
  const boxes = B.map(([n, x]) => {
    const e = div('', `<div style="font:800 32px Inter">${n}</div><div class="evrow" style="display:flex;gap:8px;margin-top:16px;justify-content:center"></div><div class="st mono" style="font-size:26px;margin-top:14px;height:32px"></div>`, host,
      `position:absolute;left:${x - 125}px;top:470px;width:250px;height:250px;border-radius:24px;border:3px solid rgba(96,165,250,.6);background:rgba(96,165,250,.08);display:flex;flex-direction:column;align-items:center;justify-content:center`);
    [0, 1, 2].forEach((k) => { const v = div('ev', '', e.querySelector('.evrow')); v.style.cssText += `;position:static;margin:0;width:50px;height:50px;background:${EVC[k]}`; });
    return e;
  });
  const read = div('', '', host, 'position:absolute;left:80px;right:80px;top:780px;text-align:center');
  const rep = div('', '', host, 'position:absolute;left:60px;right:60px;top:880px;height:300px;border-radius:24px;border:3px solid rgba(251,191,36,.6);background:rgba(251,191,36,.06)');
  div('label', '⏪ replay from offset 0', rep, 'position:absolute;left:26px;top:16px;color:#fbbf24');
  const rlog = Array.from({ length: 7 }, (_, k) => ev(rep, k, EVC[k % 6]));
  rlog.forEach((e, k) => place(e, 90 + k * 128, 130, 1, 0.9));
  const ptr = div('', '▲', rep, 'position:absolute;top:186px;font:900 40px Inter;color:#fbbf24;margin-left:-16px');
  const newC = div('svc', '🆕 new service', rep, 'left:450px;top:250px;width:300px;margin-left:-150px'); newC.style.setProperty('--cc', GRN);
  FV.scene('durable', (t, ctx) => {
    head(ctx.el, t);
    boxes.forEach((b, i) => enter(b, t, 0.15 + i * 0.1, 0.4, 20));
    pop(read, t, frac(ctx, 0, 0.08), 0.4);
    read.innerHTML = `<span class="pill" style="font-size:32px;border:3px solid ${GRN};background:rgba(52,211,153,.1)">✓ read ≠ deleted · stored &amp; copied ×3</span>`;
    const die = frac(ctx, 0, 0.4);
    const dead = t > die;
    boxes[1].style.borderColor = dead ? RED : '';
    boxes[1].style.opacity = dead ? 0.45 : boxes[1].style.opacity;
    boxes[1].querySelector('.st').innerHTML = dead ? `<span style="color:${RED}">✗ down</span>` : '';
    [0, 2].forEach((i) => (boxes[i].querySelector('.st').innerHTML = t > die + 0.5 ? `<span style="color:${GRN}">✓ has the data</span>` : ''));
    css(boxes[1], { x: dead && t < die + 0.6 ? Math.sin(t * 60) * 10 : 0 });
    const r0 = frac(ctx, 0, 0.75);
    enter(rep, t, r0 - 0.3, 0.4, 20);
    const k = Math.min(6, Math.floor(Math.max(0, t - r0) * 4));
    ptr.style.left = `${90 + k * 128}px`;
    ptr.style.opacity = seg(t, r0, r0 + 0.2);
    rlog.forEach((e, i) => (e.style.boxShadow = i <= k && t > r0 ? '0 0 18px #fbbf24' : 'none'));
    pop(newC, t, r0, 0.4);
  });
}

/* OUTRO */
{
  const L = [['Producers', 'write events', BLU], ['Topic', 'an append-only log', O2], ['Partitions', 'spread across brokers', PUR], ['Consumers', 'read at their own pace', GRN]];
  const items = L.map(([a, b, c]) => div('', `<span style="font:800 44px Inter;width:300px">${a}</span><span style="font:600 30px Inter;color:#9aa1b8">${b}</span>`, $('#oc-list'),
    `display:flex;align-items:center;padding:16px 34px;border-radius:22px;border:3px solid ${c}99;background:${c}1f;width:880px;box-sizing:border-box`));
  FV.scene('outro', (t, ctx) => {
    pop($('#oc-h'), t, 0.05, 0.5);
    items.forEach((e, i) => enter(e, t, 0.5 + i * 0.12, 0.35, 20));
    pop($('#oc-gh'), t, frac(ctx, 0, 0.95), 0.5);
  });
}
})();
</script>
</body>
</html>
