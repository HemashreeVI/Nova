<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wi-Fi Short</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#eef2f6;--mut:#94a3b8;--acc:#22c55e;--acc2:#4ade80;--grn:#34d399;--red:#f87171;--yel:#fbbf24;--pk:#f472b6;--cy:#22d3ee}
  #fv-stage{background:radial-gradient(1000px 1300px at 70% 15%,#0d2b1a 0%,#07140d 50%,#040806 80%);color:var(--ink);font-family:Inter,system-ui,sans-serif}
  #bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(34,197,94,.11) 1px,transparent 1px),linear-gradient(90deg,rgba(34,197,94,.11) 1px,transparent 1px);background-size:90px 90px;opacity:.22}
  .abs{position:absolute}
  .step{position:absolute;left:0;right:0;top:250px;text-align:center;font:700 34px/1 'JetBrains Mono',monospace;letter-spacing:.2em;color:var(--acc2)}
  .head{position:absolute;left:60px;right:60px;top:305px;text-align:center;font:800 84px/1.05 Inter;letter-spacing:-.03em}
  .mono{font-family:'JetBrains Mono',monospace}
  .badge{position:absolute;left:50%;top:150px;transform:translateX(-50%);padding:12px 26px;border-radius:40px;background:color-mix(in srgb,var(--acc) 12%,transparent);border:2px solid color-mix(in srgb,var(--acc) 55%,transparent);font:700 30px Inter;color:var(--acc2);white-space:nowrap}
  .pill{display:inline-block;padding:12px 26px;border-radius:40px;font:800 32px Inter}
  .pane{position:absolute;left:120px;width:840px;height:765px;border-radius:26px;overflow:hidden;border:3px solid color-mix(in srgb,var(--acc) 45%,transparent);background:rgba(8,8,16,.75)}
  .pane svg{position:absolute;inset:0;width:840px;height:765px}
  .below{position:absolute;left:0;right:0;top:1225px;text-align:center}
  .big{font:900 120px/1 Inter;letter-spacing:-.04em;color:#fff}
  .card{border-radius:22px;padding:26px 30px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.14)}
  .fv-endcard{display:inline-block;padding:16px 30px;border-radius:40px;font:700 34px 'JetBrains Mono',monospace;border:3px solid #eef2f6;background:rgba(238,242,246,.08)}
</style>
</head>
<body>
<div id="fv-stage">
  <div id="bg-grid"></div>
  <div class="badge">🔐 Cybersecurity · Tech, decoded</div>
<section class="fv-scene" data-scene="hook"><div class="pane" id="hk-p" style="top:300px"></div><div id="hk-q" class="abs" style="left:0;right:0;top:1110px;text-align:center"><div class="big" style="font-size:100px">📶 Wi-Fi <span style="color:var(--acc2)">cracking</span></div></div></section>
<section class="fv-scene" data-scene="handshake"><div class="step">STEP 1</div><div class="head">The handshake</div><div class="pane" id="hs-p" style="top:430px"></div><div class="below" id="hs-t"></div></section>
<section class="fv-scene" data-scene="capture"><div class="step">STEP 2</div><div class="head">Recorded from the air</div><div class="pane" id="cp-p" style="top:430px"></div><div class="below" id="cp-t"></div></section>
<section class="fv-scene" data-scene="guess"><div class="step">STEP 3</div><div class="head">Guessing offline</div><div class="pane" id="gs-p" style="top:430px"></div><div class="below" id="gs-t"></div></section>
<section class="fv-scene" data-scene="fix"><div class="step">HOW TO STOP IT</div><div class="head">Make it hopeless</div><div id="fx-c" class="abs" style="left:90px;right:90px;top:450px;display:grid;gap:22px"></div></section>
<section class="fv-scene" data-scene="outro"><div id="oc-w" class="abs" style="left:40px;right:40px;top:640px;display:grid;justify-items:center;gap:22px"></div></section>
</div>
<script src="timing.js"></script>
<script src="fv-runtime.js"></script>
<script>
(() => {
const { seg, css, enter, lerp, clamp, ease, pulse, $ } = FV;
const NS = 'http://www.w3.org/2000/svg';
const svgEl = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const txt = (s, x, y, str, o = {}) => { const e = svgEl('text', Object.assign({ x, y, fill: '#eef2f6', 'font-size': 30, 'font-weight': 700, 'font-family': 'Inter', 'text-anchor': 'middle' }, o), s); e.textContent = str; return e; };
const div = (cls, html, parent, style) => { const e = document.createElement('div'); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; if (style) e.style.cssText = style; if (parent) parent.appendChild(e); return e; };
const pop = (el, t, a, d = 0.45) => { const p = seg(t, a, a + d, ease.back); css(el, { o: clamp(p * 1.5), s: Math.max(0, p) }); return p; };
const head = (el, t) => { const s = el.querySelector('.step'), h = el.querySelector('.head'); if (s) enter(s, t, 0.0, 0.4); if (h) enter(h, t, 0.08, 0.45, 30); };
const frac = (ctx, i, f) => ctx.line(i) + (ctx.lineEnd(i) - ctx.line(i)) * f;
const pill = (t, c) => `<span class="pill" style="border:3px solid ${c};background:${c}1a;color:${c}">${t}</span>`;
const show = (el, html) => { if (el.__h !== html) { el.innerHTML = html; el.__h = html; } };

function flowPane(host) { return svgEl('svg', { viewBox: '0 0 840 765' }, host); }
function node(s, x, y, w, h, title, sub, c) {
  const g = svgEl('g', { opacity: 0 }, s);
  const r = svgEl('rect', { x: x - w / 2, y: y - h / 2, width: w, height: h, rx: 18, fill: '#0f172a', stroke: c, 'stroke-width': 4 }, g);
  txt(g, x, y + (sub ? -4 : 10), title, { 'font-size': 30, 'font-weight': 800, fill: '#f1f5f9' });
  if (sub) txt(g, x, y + 30, sub, { 'font-size': 22, fill: '#94a3b8', 'font-family': 'JetBrains Mono' });
  return { g, r, x, y, w, h, c };
}
function link(s, a, b, c = '#64748b') { return svgEl('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: c, 'stroke-width': 4, 'stroke-dasharray': '10 10', opacity: 0 }, s); }
function packet(s, label, c) {
  const g = svgEl('g', { opacity: 0 }, s);
  const w = Math.max(90, label.length * 15 + 34);
  svgEl('rect', { x: -w / 2, y: -24, width: w, height: 48, rx: 24, fill: c }, g);
  txt(g, 0, 9, label, { 'font-size': 24, 'font-weight': 800, fill: '#0b1020', 'font-family': 'JetBrains Mono' });
  return g;
}
function move(p, a, b, u) { if (u <= 0 || u >= 1) { p.setAttribute('opacity', 0); return; } p.setAttribute('opacity', 1); p.setAttribute('transform', `translate(${lerp(a.x, b.x, ease.inOut(u))} ${lerp(a.y, b.y, ease.inOut(u))})`); }

const scene3 = (host) => { const s = flowPane(host);
  const ph = node(s, 170, 300, 220, 110, '📱 phone', 'joining…', '#22d3ee'), ro = node(s, 670, 300, 220, 110, '📡 router', 'home Wi-Fi', '#4ade80');
  const hk = node(s, 420, 640, 260, 110, '💻 attacker', 'parked outside', '#f87171'); return { s, ph, ro, hk }; };
/* HOOK */
{
  const host = $('#hk-p');
  host.innerHTML = `<div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center"><div><div style="font-size:120px">📡</div>
    <div class="mono" style="margin-top:20px;font-size:40px;color:#e5e7eb">password: <span class="pw" style="color:#4ade80">••••••••</span></div>
    <div class="mono tm" style="margin-top:34px;font-size:46px;font-weight:800;color:#f87171"></div></div></div>`;
  FV.scene('hook', (t, ctx) => {
    enter(host, t, 0.05, 0.4, 20);
    const u = seg(t, 0.8, frac(ctx, 0, 0.8), ease.linear), cr = u >= 1;
    host.querySelector('.tm').textContent = u > 0 ? (cr ? '✗ cracked in 3 min 12 s' : `⏱ ${Math.floor(u * 192 / 60)} min ${Math.floor(u * 192 % 60)} s`) : '';
    host.querySelector('.pw').textContent = cr ? 'sunshine1' : '••••••••'; host.querySelector('.pw').style.color = cr ? '#f87171' : '#4ade80';
    pop($('#hk-q'), t, ctx.line(1) - 0.1, 0.5);
  });
}
/* HANDSHAKE: 4 messages */
{
  const D = scene3($('#hs-p')); const msgs = ['1', '2', '3', '4'].map((n) => packet(D.s, n, '#4ade80'));
  FV.scene('handshake', (t, ctx) => {
    head(ctx.el, t); enter($('#hs-p'), t, 0.1, 0.4, 20);
    D.ph.g.setAttribute('opacity', 1); D.ro.g.setAttribute('opacity', 1); D.hk.g.setAttribute('opacity', 0);
    msgs.forEach((m, i) => { const a = frac(ctx, 0, 0.1 + i * 0.2), b = a + (frac(ctx, 0, 0.3) - frac(ctx, 0, 0.1)); move(m, i % 2 ? D.ro : D.ph, i % 2 ? D.ph : D.ro, (t - a) / (b - a)); });
    show($('#hs-t'), pill('4 short messages every time a device joins', '#4ade80')); $('#hs-t').style.opacity = seg(t, 0.4, 0.7);
  });
}
/* CAPTURE: copies fly to the attacker */
{
  const D = scene3($('#cp-p')); const msgs = ['1', '2', '3', '4'].map((n) => packet(D.s, n, '#4ade80')); const cps = ['1', '2', '3', '4'].map((n) => packet(D.s, n, '#f87171'));
  const mid = { x: 420, y: 300 };
  FV.scene('capture', (t, ctx) => {
    head(ctx.el, t); enter($('#cp-p'), t, 0.1, 0.4, 20);
    [D.ph, D.ro].forEach((n) => n.g.setAttribute('opacity', 1)); D.hk.g.setAttribute('opacity', seg(t, 0.2, 0.6));
    msgs.forEach((m, i) => { const a = frac(ctx, 0, 0.05 + i * 0.15); move(m, i % 2 ? D.ro : D.ph, i % 2 ? D.ph : D.ro, (t - a) / 0.6); });
    cps.forEach((m, i) => { const a = frac(ctx, 0, 0.1 + i * 0.15); move(m, mid, D.hk, (t - a) / 0.7); });
    show($('#cp-t'), pill('📼 recorded, then taken home', '#f87171')); $('#cp-t').style.opacity = seg(t, 0.4, 0.7);
  });
}
/* GUESS: word list against the recording */
{
  const host = $('#gs-p'); const W = ['password', 'qwerty123', 'iloveyou', '12345678', 'dragon99', 'football1', 'monkey12', 'letmein!', 'welcome1', 'sunshine1'];
  host.innerHTML = `<div style="position:absolute;inset:0;padding:40px;font-family:'JetBrains Mono'"><div style="display:flex;justify-content:space-between;font:800 28px Inter;color:#94a3b8"><span>🖥️ graphics card</span><span class="n" style="color:#fbbf24"></span></div><div class="l" style="margin-top:26px;display:grid;gap:12px"></div></div>`;
  const rows = W.map((w) => div('', '', host.querySelector('.l'), 'font-size:32px'));
  FV.scene('guess', (t, ctx) => {
    head(ctx.el, t); enter(host, t, 0.1, 0.4, 20);
    const u = seg(t, frac(ctx, 0, 0.05), frac(ctx, 0, 0.85), ease.linear), k = Math.floor(u * W.length);
    rows.forEach((r, i) => { r.innerHTML = i < k ? (i === W.length - 1 ? `<span style="color:#f87171;font-weight:800">${W[i]}  ✓ MATCH</span>` : `<span style="color:#64748b">${W[i]}  ✗</span>`) : ''; });
    host.querySelector('.n').textContent = `${Math.round(Math.pow(10, 3 + u * 6.2)).toLocaleString('en-US')} tries`;
    show($('#gs-t'), pill('no router to slow them down', '#fbbf24')); $('#gs-t').style.opacity = seg(t, 0.4, 0.7);
  });
}
/* FIX: compare, then the checklist */
{
  const box = $('#fx-c');
  const cmp = div('card', `<div style="display:grid;gap:18px;font-family:'JetBrains Mono'"><div style="display:flex;justify-content:space-between;font-size:32px"><span style="color:#f87171">sunshine1</span><span style="color:#f87171;font-weight:800">minutes</span></div>
    <div style="display:flex;justify-content:space-between;font-size:32px"><span style="color:#4ade80">tiger-violin-cloud-82-ruby</span><span style="color:#4ade80;font-weight:800">centuries</span></div></div>`, box);
  const C = [['🔑', 'Long random passphrase', '4+ random words, not a name or a date', '#4ade80'], ['🛡️', 'Switch to WPA3', 'it blocks offline guessing', '#22d3ee'], ['🚫', 'Turn off WPS', 'a common shortcut into routers', '#fbbf24']];
  const cards = C.map(([i, a, b, c]) => div('card', `<div style="display:flex;gap:22px;align-items:center"><div style="font-size:58px">${i}</div><div><div style="font:800 38px Inter;color:${c}">${a}</div><div style="font:500 26px Inter;color:#cbd5e1;margin-top:4px">${b}</div></div></div>`, box, `border-color:${c}66`));
  FV.scene('fix', (t, ctx) => {
    head(ctx.el, t); enter(cmp, t, frac(ctx, 0, 0.02), 0.45, 30);
    cards.forEach((c, i) => enter(c, t, frac(ctx, 0, 0.42 + i * 0.17), 0.45, 30));
  });
}
/* OUTRO */
{
  const Wd = [['Long passphrase.', '#4ade80', 0], ['WPA3.', '#22d3ee', 0.3], ['WPS off.', '#fbbf24', 0.55]];
  const w = Wd.map(([s, c]) => div('', s, $('#oc-w'), `font:900 96px/1.05 Inter;letter-spacing:-.03em;color:${c};text-align:center`));
  FV.scene('outro', (t, ctx) => w.forEach((e, i) => pop(e, t, frac(ctx, 0, Wd[i][2]), 0.4)));
}

})();
</script>
</body>
</html>
