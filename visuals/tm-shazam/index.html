<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shazam Short</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#eef2f6;--mut:#94a3b8;--acc:#a855f7;--acc2:#e9d5ff;--grn:#34d399;--red:#f87171;--yel:#fbbf24;--pk:#f472b6;--cy:#22d3ee}
  #fv-stage{background:radial-gradient(1000px 1300px at 70% 12%,#2b1458 0%,#140b2e 52%,#08061a 82%);color:var(--ink);font-family:Inter,system-ui,sans-serif}
  #bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(192,132,252,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(192,132,252,.12) 1px,transparent 1px);background-size:90px 90px;opacity:.22}
  .abs{position:absolute}
  .step{position:absolute;left:0;right:0;top:250px;text-align:center;font:700 34px/1 'JetBrains Mono',monospace;letter-spacing:.2em;color:var(--acc2)}
  .head{position:absolute;left:60px;right:60px;top:305px;text-align:center;font:800 84px/1.05 Inter;letter-spacing:-.03em}
  .mono{font-family:'JetBrains Mono',monospace}
  .badge{position:absolute;left:50%;top:150px;transform:translateX(-50%);padding:12px 26px;border-radius:40px;background:color-mix(in srgb,var(--acc) 12%,transparent);border:2px solid color-mix(in srgb,var(--acc) 55%,transparent);font:700 30px Inter;color:var(--acc2);white-space:nowrap}
  .pill{display:inline-block;padding:12px 26px;border-radius:40px;font:800 32px Inter}
  .pane{position:absolute;left:120px;width:840px;height:765px;border-radius:26px;overflow:hidden;border:3px solid color-mix(in srgb,var(--acc) 45%,transparent);background:rgba(8,8,16,.75)}
  .pane svg{position:absolute;inset:0;width:840px;height:765px}
  .below{position:absolute;left:0;right:0;top:1225px;text-align:center}
  .big{font:900 120px/1 Inter;letter-spacing:-.04em;color:#fff}
  .card{border-radius:22px;padding:26px 30px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.14)}
  .fv-endcard{display:inline-block;padding:16px 30px;border-radius:40px;font:700 34px 'JetBrains Mono',monospace;border:3px solid #eef2f6;background:rgba(238,242,246,.08)}
</style>
</head>
<body>
<div id="fv-stage">
  <div id="bg-grid"></div>
  <div class="badge">🕵️ Tech Mysteries</div>
<section class="fv-scene" data-scene="hook"><div class="pane" id="hk-p" style="top:300px"></div><div id="hk-q" class="abs" style="left:0;right:0;top:1110px;text-align:center"><div class="big" style="font-size:100px">How? 🎵</div></div></section>
<section class="fv-scene" data-scene="spectro"><div class="step">STEP 1</div><div class="head">Sound → picture</div><div class="pane" id="sp-p" style="top:430px"></div><div class="below" id="sp-t"></div></section>
<section class="fv-scene" data-scene="peaks"><div class="step">STEP 2</div><div class="head">Keep the brightest</div><div class="pane" id="pk-p" style="top:430px"></div><div class="below" id="pk-t"></div></section>
<section class="fv-scene" data-scene="hash"><div class="step">STEP 3</div><div class="head">Fingerprints</div><div class="pane" id="hs-p" style="top:430px"></div><div class="below" id="hs-t"></div></section>
<section class="fv-scene" data-scene="match"><div class="step">STEP 4</div><div class="head">Find the match</div><div class="pane" id="mt-p" style="top:430px"></div><div class="below" id="mt-t"></div></section>
<section class="fv-scene" data-scene="outro"><div id="oc-w" class="abs" style="left:40px;right:40px;top:600px;display:grid;justify-items:center;gap:18px"></div></section>
</div>
<script src="timing.js"></script>
<script src="fv-runtime.js"></script>
<script>
(() => {
const { seg, css, enter, lerp, clamp, ease, pulse, $ } = FV;
const NS = 'http://www.w3.org/2000/svg';
const svgEl = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const txt = (s, x, y, str, o = {}) => { const e = svgEl('text', Object.assign({ x, y, fill: '#eef2f6', 'font-size': 30, 'font-weight': 700, 'font-family': 'Inter', 'text-anchor': 'middle' }, o), s); e.textContent = str; return e; };
const div = (cls, html, parent, style) => { const e = document.createElement('div'); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; if (style) e.style.cssText = style; if (parent) parent.appendChild(e); return e; };
const pop = (el, t, a, d = 0.45) => { const p = seg(t, a, a + d, ease.back); css(el, { o: clamp(p * 1.5), s: Math.max(0, p) }); return p; };
const head = (el, t) => { const s = el.querySelector('.step'), h = el.querySelector('.head'); if (s) enter(s, t, 0.0, 0.4); if (h) enter(h, t, 0.08, 0.45, 30); };
const frac = (ctx, i, f) => ctx.line(i) + (ctx.lineEnd(i) - ctx.line(i)) * f;
const pill = (t, c) => `<span class="pill" style="border:3px solid ${c};background:${c}1a;color:${c}">${t}</span>`;
const show = (el, html) => { if (el.__h !== html) { el.innerHTML = html; el.__h = html; } };

function flowPane(host) { return svgEl('svg', { viewBox: '0 0 840 765' }, host); }
function node(s, x, y, w, h, title, sub, c) {
  const g = svgEl('g', { opacity: 0 }, s);
  const r = svgEl('rect', { x: x - w / 2, y: y - h / 2, width: w, height: h, rx: 18, fill: '#0f172a', stroke: c, 'stroke-width': 4 }, g);
  txt(g, x, y + (sub ? -4 : 10), title, { 'font-size': 30, 'font-weight': 800, fill: '#f1f5f9' });
  if (sub) txt(g, x, y + 30, sub, { 'font-size': 22, fill: '#94a3b8', 'font-family': 'JetBrains Mono' });
  return { g, r, x, y, w, h, c };
}
function link(s, a, b, c = '#64748b') { return svgEl('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: c, 'stroke-width': 4, 'stroke-dasharray': '10 10', opacity: 0 }, s); }
function packet(s, label, c) {
  const g = svgEl('g', { opacity: 0 }, s);
  const w = Math.max(90, label.length * 15 + 34);
  svgEl('rect', { x: -w / 2, y: -24, width: w, height: 48, rx: 24, fill: c }, g);
  txt(g, 0, 9, label, { 'font-size': 24, 'font-weight': 800, fill: '#0b1020', 'font-family': 'JetBrains Mono' });
  return g;
}
function move(p, a, b, u) { if (u <= 0 || u >= 1) { p.setAttribute('opacity', 0); return; } p.setAttribute('opacity', 1); p.setAttribute('transform', `translate(${lerp(a.x, b.x, ease.inOut(u))} ${lerp(a.y, b.y, ease.inOut(u))})`); }

/* phone(s, cx, cy, k): returns { g, screen } where screen is a group in local coords 0..200 x 0..380 */
function phone(s, cx, cy, k = 1, o = {}) {
  const g = svgEl('g', { transform: `translate(${cx - 110 * k} ${cy - 205 * k}) scale(${k})` }, s);
  svgEl('rect', { x: 0, y: 0, width: 220, height: 410, rx: 34, fill: '#0b0b14', stroke: o.c || '#c4b5fd', 'stroke-width': 5 / k * k }, g);
  svgEl('rect', { x: 12, y: 14, width: 196, height: 382, rx: 24, fill: o.screen || '#17142b' }, g);
  svgEl('rect', { x: 80, y: 22, width: 60, height: 12, rx: 6, fill: '#0b0b14' }, g);
  const screen = svgEl('g', { transform: 'translate(12 14)' }, g);
  return { g, screen };
}
const ring = (s, cx, cy, c, t, speed = 1, n = 3, max = 160) => { const g = svgEl('g', {}, s); const R = Array.from({ length: n }, () => svgEl('circle', { cx, cy, r: 0, fill: 'none', stroke: c, 'stroke-width': 4 }, g));
  return (t, on = 1) => R.forEach((r, i) => { const u = ((t * speed + i / n) % 1); r.setAttribute('r', 20 + u * max); r.setAttribute('opacity', on * (1 - u)); }); };

/* deterministic "song": a grid of energies with a few melody lines + noise */
const COLS = 36, ROWS = 20; let sd = 5; const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
const E = Array.from({ length: COLS }, (_, c) => Array.from({ length: ROWS }, (_, r) => 0.15 * rnd() + (Math.abs(r - (6 + Math.round(4 * Math.sin(c / 3)))) < 1 ? 0.9 : 0) + (Math.abs(r - (14 + Math.round(2 * Math.cos(c / 2)))) < 1 && c % 3 !== 1 ? 0.75 : 0) + (rnd() > 0.93 ? 0.5 : 0)));
const PEAKS = []; for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) { const v = E[c][r]; if (v > 0.7 && (c + r) % 2 === 0) PEAKS.push([c, r]); }
const heat = (v) => `hsl(${280 - v * 230},90%,${12 + v * 55}%)`;
function grid(s, x0 = 60, y0 = 60, cw = 20, ch = 26) { const cells = []; for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) cells.push({ c, r, el: svgEl('rect', { x: x0 + c * cw, y: y0 + (ROWS - 1 - r) * ch, width: cw - 1, height: ch - 1, fill: heat(E[c][r]) }, s) }); return { cells, x0, y0, cw, ch, cx: (c) => x0 + c * cw + cw / 2, cy: (r) => y0 + (ROWS - 1 - r) * ch + ch / 2 }; }
/* HOOK: café noise + phone listening */
{
  const s = flowPane($('#hk-p'));
  const bub = ['☕', '🗣️', '🍽️', '🗣️', '🎶'].map((e, i) => txt(s, 120 + i * 150, 140 + (i % 2) * 80, e, { 'font-size': 64 }));
  const P1 = phone(s, 420, 470, 0.8); const lbl = txt(P1.screen, 98, 180, 'listening…', { 'font-size': 26, fill: '#c4b5fd' });
  const res = svgEl('g', { opacity: 0 }, P1.screen); svgEl('rect', { x: 10, y: 220, width: 176, height: 110, rx: 16, fill: '#2563eb' }, res); txt(res, 98, 262, '🎵 Midnight City', { 'font-size': 20, 'font-weight': 800 }); txt(res, 98, 296, 'found in 3.1 s', { 'font-size': 18, fill: '#bfdbfe' });
  const r = ring(s, 420, 400, '#f0abfc', 0, 1, 3, 200);
  FV.scene('hook', (t, ctx) => {
    enter($('#hk-p'), t, 0.05, 0.4, 20); r(t, 1 - seg(t, frac(ctx, 0, 0.7), frac(ctx, 0, 0.8)));
    bub.forEach((b, i) => b.setAttribute('transform', `translate(0 ${Math.sin(t * 3 + i) * 8})`));
    res.setAttribute('opacity', seg(t, frac(ctx, 0, 0.75), frac(ctx, 0, 0.85))); lbl.setAttribute('opacity', 1 - seg(t, frac(ctx, 0, 0.75), frac(ctx, 0, 0.85)));
    pop($('#hk-q'), t, ctx.line(1) - 0.1, 0.5);
  });
}
/* SPECTRO: waveform scrolls in, grid paints column by column */
{
  const s = flowPane($('#sp-p')); const G = grid(s, 60, 150);
  const wave = svgEl('path', { fill: 'none', stroke: '#e9d5ff', 'stroke-width': 3 }, s);
  txt(s, 40, 700, 'time →', { 'text-anchor': 'start', 'font-size': 24, fill: '#c4b5fd' }); txt(s, 30, 140, 'pitch ↑', { 'text-anchor': 'start', 'font-size': 24, fill: '#c4b5fd' });
  FV.scene('spectro', (t, ctx) => {
    head(ctx.el, t); enter($('#sp-p'), t, 0.1, 0.4, 20);
    const u = seg(t, frac(ctx, 0, 0.15), frac(ctx, 0, 0.9), ease.linear), n = u * COLS;
    G.cells.forEach((x) => x.el.setAttribute('opacity', x.c < n ? 1 : 0.06));
    let d = ''; for (let x = 60; x <= 780; x += 4) d += (x === 60 ? 'M' : 'L') + x + ' ' + (90 + Math.sin(x / 9 + t * 6) * 26 * Math.sin(x / 70)); wave.setAttribute('d', d);
    show($('#sp-t'), pill('brighter = louder', '#f0abfc')); $('#sp-t').style.opacity = seg(t, 0.4, 0.7);
  });
}
/* PEAKS: everything dims except the peaks, which become stars */
{
  const s = flowPane($('#pk-p')); const G = grid(s, 60, 150);
  const stars = PEAKS.map(([c, r]) => svgEl('circle', { cx: G.cx(c), cy: G.cy(r), r: 0, fill: '#fde68a' }, s));
  FV.scene('peaks', (t, ctx) => {
    head(ctx.el, t); enter($('#pk-p'), t, 0.1, 0.4, 20);
    const d = seg(t, frac(ctx, 0, 0.15), frac(ctx, 0, 0.5));
    G.cells.forEach((x) => x.el.setAttribute('opacity', 1 - 0.92 * d));
    stars.forEach((st, i) => { const p = seg(t, frac(ctx, 0, 0.4) + i * 0.02, frac(ctx, 0, 0.5) + i * 0.02, ease.back); st.setAttribute('r', 7 * p + Math.sin(t * 6 + i) * p); });
    show($('#pk-t'), pill(`✨ ${PEAKS.length} stars: noise falls away`, '#fde68a')); $('#pk-t').style.opacity = seg(t, frac(ctx, 0, 0.6), frac(ctx, 0, 0.75));
  });
}
/* HASH: link pairs of stars, show a fingerprint */
{
  const s = flowPane($('#hs-p')); const x0 = 60, y0 = 120, cw = 20, ch = 22, cx = (c) => x0 + c * cw + cw / 2, cy = (r) => y0 + (ROWS - 1 - r) * ch + ch / 2;
  PEAKS.forEach(([c, r]) => svgEl('circle', { cx: cx(c), cy: cy(r), r: 6, fill: '#fde68a', opacity: .55 }, s));
  const pairs = []; for (let i = 0; i < PEAKS.length && pairs.length < 7; i += 3) { const a = PEAKS[i], b = PEAKS.find((p) => p[0] > a[0] + 2 && p[0] < a[0] + 7); if (b) pairs.push([a, b]); }
  const L = pairs.map(([a, b]) => svgEl('line', { x1: cx(a[0]), y1: cy(a[1]), x2: cx(b[0]), y2: cy(b[1]), stroke: '#f0abfc', 'stroke-width': 4, opacity: 0 }, s));
  const [a, b] = pairs[1]; const hl = svgEl('g', { opacity: 0 }, s);
  svgEl('circle', { cx: cx(a[0]), cy: cy(a[1]), r: 12, fill: 'none', stroke: '#fff', 'stroke-width': 3 }, hl); svgEl('circle', { cx: cx(b[0]), cy: cy(b[1]), r: 12, fill: 'none', stroke: '#fff', 'stroke-width': 3 }, hl);
  const card = svgEl('g', { opacity: 0 }, s); svgEl('rect', { x: 110, y: 600, width: 620, height: 110, rx: 18, fill: '#221b3d', stroke: '#f0abfc', 'stroke-width': 3 }, card);
  txt(card, 420, 645, `🎹 note ${a[1] * 37 + 200} Hz → note ${b[1] * 37 + 200} Hz`, { 'font-size': 28, 'font-family': 'JetBrains Mono' }); txt(card, 420, 690, `⏱ ${((b[0] - a[0]) * 0.1).toFixed(1)} s apart  =  one fingerprint`, { 'font-size': 26, fill: '#f0abfc', 'font-family': 'JetBrains Mono' });
  FV.scene('hash', (t, ctx) => {
    head(ctx.el, t); enter($('#hs-p'), t, 0.1, 0.4, 20);
    L.forEach((l, i) => l.setAttribute('opacity', seg(t, frac(ctx, 0, 0.1 + i * 0.06), frac(ctx, 0, 0.2 + i * 0.06))));
    hl.setAttribute('opacity', seg(t, frac(ctx, 0, 0.5), frac(ctx, 0, 0.6))); card.setAttribute('opacity', seg(t, frac(ctx, 0, 0.55), frac(ctx, 0, 0.7)));
    show($('#hs-t'), pill('hundreds of fingerprints per clip', '#f0abfc')); $('#hs-t').style.opacity = seg(t, frac(ctx, 0, 0.8), frac(ctx, 0, 0.9));
  });
}
/* MATCH: database rows with match counts; one spikes */
{
  const host = $('#mt-p'); const S = [['Blinding Lights', 3], ['Levitating', 5], ['Midnight City', 212], ['Shape of You', 4], ['Bad Habits', 2], ['Heat Waves', 6]];
  host.innerHTML = `<div style="position:absolute;inset:34px"><div style="font:800 30px Inter;color:#c4b5fd;margin-bottom:18px">🗄️ millions of songs · fingerprints lined up</div><div class="l" style="display:grid;gap:14px"></div></div>`;
  const rows = S.map(([n, v]) => { const r = div('', `<div style="display:flex;align-items:center;gap:16px;padding:12px 16px;border-radius:14px;background:#1b1535"><div style="width:250px;font:700 28px Inter">${n}</div><div style="flex:1;height:26px;border-radius:13px;background:rgba(255,255,255,.06);overflow:hidden"><div class="f" style="height:100%;width:0;background:#a855f7"></div></div><div class="mono c" style="width:70px;text-align:right;font:800 26px 'JetBrains Mono'">0</div></div>`, host.querySelector('.l')); return { r, v }; });
  FV.scene('match', (t, ctx) => {
    head(ctx.el, t); enter(host, t, 0.1, 0.4, 20);
    const u = seg(t, frac(ctx, 0, 0.3), frac(ctx, 0, 0.85), ease.inOut);
    rows.forEach(({ r, v }) => { r.querySelector('.f').style.width = Math.min(100, v / 2.2) * u + '%'; r.querySelector('.c').textContent = Math.round(v * u); const win = v > 100 && u > 0.95; r.firstChild.style.background = win ? 'rgba(52,211,153,.18)' : '#1b1535'; r.firstChild.style.outline = win ? '3px solid #34d399' : 'none'; r.querySelector('.f').style.background = win ? '#34d399' : '#a855f7'; });
    show($('#mt-t'), pill('✓ same timing, one song: match!', '#34d399')); $('#mt-t').style.opacity = seg(t, frac(ctx, 0, 0.85), frac(ctx, 0, 0.95));
  });
}
/* OUTRO */
{
  const Wd = [['Sound → picture.', '#f0abfc', 0], ['Picture → stars. ✨', '#fde68a', 0.3], ['Stars → song. 🎵', '#34d399', 0.6]];
  const w = Wd.map(([s, c]) => div('', s, $('#oc-w'), `font:900 92px/1.08 Inter;letter-spacing:-.03em;color:${c};text-align:center`));
  FV.scene('outro', (t, ctx) => w.forEach((e, i) => pop(e, t, frac(ctx, 0, Wd[i][2]), 0.4)));
}

})();
</script>
</body>
</html>
