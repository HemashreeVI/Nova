<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sensor fusion Short</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#eef2f6;--mut:#94a3b8;--acc:#ef4444;--acc2:#f87171;--grn:#34d399;--red:#f87171;--yel:#fbbf24;--pk:#f472b6;--cy:#22d3ee}
  #fv-stage{background:radial-gradient(1000px 1300px at 70% 15%,#3a1414 0%,#170c12 50%,#09060a 80%);color:var(--ink);font-family:Inter,system-ui,sans-serif}
  #bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(239,68,68,.11) 1px,transparent 1px),linear-gradient(90deg,rgba(239,68,68,.11) 1px,transparent 1px);background-size:90px 90px;opacity:.22}
  .abs{position:absolute}
  .step{position:absolute;left:0;right:0;top:250px;text-align:center;font:700 34px/1 'JetBrains Mono',monospace;letter-spacing:.2em;color:var(--acc2)}
  .head{position:absolute;left:60px;right:60px;top:305px;text-align:center;font:800 84px/1.05 Inter;letter-spacing:-.03em}
  .mono{font-family:'JetBrains Mono',monospace}
  .badge{position:absolute;left:50%;top:150px;transform:translateX(-50%);padding:12px 26px;border-radius:40px;background:color-mix(in srgb,var(--acc) 12%,transparent);border:2px solid color-mix(in srgb,var(--acc) 55%,transparent);font:700 30px Inter;color:var(--acc2);white-space:nowrap}
  .pill{display:inline-block;padding:12px 26px;border-radius:40px;font:800 32px Inter}
  .pane{position:absolute;left:120px;width:840px;height:765px;border-radius:26px;overflow:hidden;border:3px solid color-mix(in srgb,var(--acc) 45%,transparent);background:rgba(8,8,16,.75)}
  .pane svg{position:absolute;inset:0;width:840px;height:765px}
  .below{position:absolute;left:0;right:0;top:1225px;text-align:center}
  .big{font:900 120px/1 Inter;letter-spacing:-.04em;color:#fff}
  .card{border-radius:22px;padding:26px 30px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.14)}
  .fv-endcard{display:inline-block;padding:16px 30px;border-radius:40px;font:700 34px 'JetBrains Mono',monospace;border:3px solid #eef2f6;background:rgba(238,242,246,.08)}
</style>
</head>
<body>
<div id="fv-stage">
  <div id="bg-grid"></div>
  <div class="badge">🤖 Robotics · Tech, decoded</div>

  <section class="fv-scene" data-scene="hook">
    <div class="pane" id="hk-p" style="top:300px"></div>
    <div id="hk-q" class="abs" style="left:0;right:0;top:1110px;text-align:center"><div class="big" style="font-size:104px">🚗 Sensor <span style="color:var(--acc2)">fusion</span></div></div>
  </section>
  <section class="fv-scene" data-scene="camera">
    <div class="step">SENSOR 1</div><div class="head">📷 Camera</div>
    <div class="pane" id="ca-p" style="top:430px"></div>
    <div class="below" id="ca-t"></div>
  </section>
  <section class="fv-scene" data-scene="lidar">
    <div class="step">SENSOR 2</div><div class="head">🔦 LiDAR</div>
    <div class="pane" id="li-p" style="top:430px"></div>
    <div class="below" id="li-t"></div>
  </section>
  <section class="fv-scene" data-scene="radar">
    <div class="step">SENSOR 3</div><div class="head">📡 Radar</div>
    <div class="pane" id="ra-p" style="top:430px"></div>
    <div class="below" id="ra-t"></div>
  </section>
  <section class="fv-scene" data-scene="fuse">
    <div class="step">COMBINE THEM</div><div class="head">Trust the surest</div>
    <div class="pane" id="fu-p" style="top:430px"></div>
    <div class="below" id="fu-t"></div>
  </section>
  <section class="fv-scene" data-scene="outro">
    <div id="oc-w" class="abs" style="left:40px;right:40px;top:560px;display:grid;justify-items:center;gap:20px"></div>
    <div id="oc-gh" class="abs" style="left:0;right:0;top:1010px;text-align:center"><span class="fv-endcard"></span></div>
  </section>

</div>
<script src="timing.js"></script>
<script src="fv-runtime.js"></script>
<script>
(() => {
const { seg, css, enter, lerp, clamp, ease, pulse, $ } = FV;
const NS = 'http://www.w3.org/2000/svg';
const svgEl = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const txt = (s, x, y, str, o = {}) => { const e = svgEl('text', Object.assign({ x, y, fill: '#eef2f6', 'font-size': 30, 'font-weight': 700, 'font-family': 'Inter', 'text-anchor': 'middle' }, o), s); e.textContent = str; return e; };
const div = (cls, html, parent, style) => { const e = document.createElement('div'); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; if (style) e.style.cssText = style; if (parent) parent.appendChild(e); return e; };
const pop = (el, t, a, d = 0.45) => { const p = seg(t, a, a + d, ease.back); css(el, { o: clamp(p * 1.5), s: Math.max(0, p) }); return p; };
const head = (el, t) => { const s = el.querySelector('.step'), h = el.querySelector('.head'); if (s) enter(s, t, 0.0, 0.4); if (h) enter(h, t, 0.08, 0.45, 30); };
const frac = (ctx, i, f) => ctx.line(i) + (ctx.lineEnd(i) - ctx.line(i)) * f;
const pill = (t, c) => `<span class="pill" style="border:3px solid ${c};background:${c}1a;color:${c}">${t}</span>`;
const show = (el, html) => { if (el.__h !== html) { el.innerHTML = html; el.__h = html; } };

/* A night road seen from above the car: our car at the bottom, a pedestrian and a car ahead */
function road(host, o = {}) {
  const s = svgEl('svg', { viewBox: '0 0 840 765' }, host);
  svgEl('rect', { x: 0, y: 0, width: 840, height: 765, fill: o.fog ? '#1f2937' : '#0b1020' }, s);
  svgEl('rect', { x: 220, y: 0, width: 400, height: 765, fill: '#111827' }, s);
  for (let y = 0; y < 765; y += 90) svgEl('rect', { x: 414, y, width: 12, height: 50, fill: '#e5e7eb', opacity: 0.6 }, s);
  const ego = svgEl('g', {}, s); svgEl('rect', { x: 330, y: 610, width: 80, height: 130, rx: 18, fill: '#2563eb', stroke: '#93c5fd', 'stroke-width': 4 }, ego);
  const car = svgEl('g', {}, s); svgEl('rect', { x: 450, y: 170, width: 80, height: 130, rx: 18, fill: '#f59e0b' }, car);
  const ped = svgEl('text', { x: 290, y: 330, 'font-size': 70, 'text-anchor': 'middle' }, s); ped.textContent = '🚶';
  const fog = svgEl('rect', { x: 0, y: 0, width: 840, height: 765, fill: '#64748b', opacity: 0 }, s);
  if (o.sign) { const st = svgEl('text', { x: 715, y: 178, 'font-size': 50, 'text-anchor': 'middle' }, s); st.textContent = '🛑'; }
  return { s, car, ped, fog, ego };
}
const det = (s, x, y, w, h, c, label) => { const g = svgEl('g', { opacity: 0 }, s); svgEl('rect', { x, y, width: w, height: h, rx: 10, fill: 'none', stroke: c, 'stroke-width': 6 }, g); txt(g, x + w / 2, y - 14, label, { fill: c, 'font-size': 26, 'font-weight': 800 }); return g; };
/* HOOK: fog rolls in */
{
  const R = road($('#hk-p'));
  FV.scene('hook', (t, ctx) => {
    enter($('#hk-p'), t, 0.05, 0.4, 20);
    R.fog.setAttribute('opacity', 0.5 * seg(t, 0.5, frac(ctx, 0, 0.9)));
    pop($('#hk-q'), t, ctx.line(1) - 0.1, 0.5);
  });
}
/* CAMERA: great detail by day, fades in the dark */
{
  const R = road($('#ca-p'), { sign: true }); const b1 = det(R.s, 240, 250, 100, 110, '#34d399', 'person'), b2 = det(R.s, 440, 160, 100, 150, '#34d399', 'car'), sign = det(R.s, 640, 120, 150, 70, '#34d399', 'STOP sign');
  const dark = svgEl('rect', { x: 0, y: 0, width: 840, height: 765, fill: '#000', opacity: 0 }, R.s);
  FV.scene('camera', (t, ctx) => {
    head(ctx.el, t); enter($('#ca-p'), t, 0.1, 0.4, 20);
    const d = seg(t, frac(ctx, 0, 0.1), frac(ctx, 0, 0.35)), n = seg(t, frac(ctx, 0, 0.6), frac(ctx, 0, 0.8));
    [b1, b2, sign].forEach((b) => b.setAttribute('opacity', d * (1 - n * 0.85)));
    dark.setAttribute('opacity', 0.7 * n);
    show($('#ca-t'), n > 0.5 ? pill('🌙 dark or glare: it struggles', '#f87171') : pill('✓ colour, lanes, signs', '#34d399'));
    $('#ca-t').style.opacity = seg(t, 0.3, 0.6);
  });
}
/* LIDAR: point cloud, scattered by rain */
{
  const R = road($('#li-p')); const pts = svgEl('g', {}, R.s), P = [];
  const shapes = [[290, 300, 40, 70], [490, 235, 45, 70]];
  for (let i = 0; i < 220; i++) { const sh = shapes[i % 2], a = i * 2.39996; P.push([sh[0] + Math.cos(a) * sh[2] * Math.sqrt((i % 37) / 37), sh[1] + Math.sin(a) * sh[3] * Math.sqrt((i % 41) / 41)]); }
  const D = P.map(([x, y]) => svgEl('circle', { cx: x, cy: y, r: 5, fill: '#22d3ee' }, pts));
  const lab = txt(R.s, 640, 120, '', { fill: '#22d3ee', 'font-size': 30, 'font-family': 'JetBrains Mono' });
  const rain = svgEl('g', { opacity: 0 }, R.s); for (let i = 0; i < 90; i++) svgEl('line', { x1: (i * 97) % 840, y1: (i * 53) % 765, x2: (i * 97) % 840 - 10, y2: (i * 53) % 765 + 34, stroke: '#93c5fd', 'stroke-width': 3, opacity: 0.6 }, rain);
  FV.scene('lidar', (t, ctx) => {
    head(ctx.el, t); enter($('#li-p'), t, 0.1, 0.4, 20);
    const n = seg(t, frac(ctx, 0, 0.05), frac(ctx, 0, 0.4)), r = seg(t, frac(ctx, 0, 0.6), frac(ctx, 0, 0.8));
    D.forEach((d, i) => { d.setAttribute('opacity', i / D.length < n ? 1 : 0); const j = r * 60; d.setAttribute('transform', `translate(${Math.sin(i * 7.1) * j} ${Math.cos(i * 3.3) * j})`); d.setAttribute('fill', r > 0.5 && i % 3 === 0 ? '#64748b' : '#22d3ee'); });
    rain.setAttribute('opacity', r); lab.textContent = n > 0.5 ? 'car: 18.4 m' : '';
    show($('#li-t'), r > 0.5 ? pill('🌧️ rain and fog scatter the beams', '#f87171') : pill('✓ exact distance, in 3D', '#22d3ee'));
    $('#li-t').style.opacity = seg(t, 0.3, 0.6);
  });
}
/* RADAR: sees through fog, measures speed, blurry */
{
  const R = road($('#ra-p'), { fog: true }); R.fog.setAttribute('opacity', 0.35);
  const blobs = [[290, 300, 70], [490, 235, 90]].map(([x, y, r]) => svgEl('ellipse', { cx: x, cy: y, rx: r, ry: r * 0.8, fill: '#f472b6', opacity: 0 }, R.s));
  const wave = svgEl('path', { fill: 'none', stroke: '#f472b6', 'stroke-width': 4 }, R.s);
  const sp = txt(R.s, 640, 240, '', { fill: '#f472b6', 'font-size': 30, 'font-family': 'JetBrains Mono' });
  FV.scene('radar', (t, ctx) => {
    head(ctx.el, t); enter($('#ra-p'), t, 0.1, 0.4, 20);
    const k = (t * 1.4) % 1, rr = 60 + k * 600;
    wave.setAttribute('d', `M ${370 - rr} ${670 - rr * 0.2} A ${rr} ${rr} 0 0 1 ${370 + rr} ${670 - rr * 0.2}`); wave.setAttribute('opacity', 1 - k);
    const b = seg(t, frac(ctx, 0, 0.1), frac(ctx, 0, 0.35));
    blobs.forEach((e) => { e.setAttribute('opacity', 0.45 * b); e.setAttribute('filter', 'blur(2px)'); });
    sp.textContent = b > 0.5 ? 'car: −3 m/s' : '';
    const bl = seg(t, frac(ctx, 0, 0.6), frac(ctx, 0, 0.8));
    show($('#ra-t'), bl > 0.5 ? pill('🌫️ blurry, low detail', '#fbbf24') : pill('✓ sees through fog + measures speed', '#f472b6'));
    $('#ra-t').style.opacity = seg(t, 0.3, 0.6);
  });
}
/* FUSE: three uncertain guesses become one tight estimate */
{
  const R = road($('#fu-p'), { fog: true }); R.fog.setAttribute('opacity', 0.3);
  const E = [['📷', '#34d399', 300, 290, 90, 0.2], ['🔦', '#22d3ee', 282, 312, 55, 0.35], ['📡', '#f472b6', 300, 300, 120, 0.15]];
  const el = E.map(([i, c, x, y, r]) => { const g = svgEl('g', { opacity: 0 }, R.s); svgEl('circle', { cx: x, cy: y, r, fill: c, 'fill-opacity': 0.12, stroke: c, 'stroke-width': 4, 'stroke-dasharray': '10 8' }, g); txt(g, x - r * 0.8, y - r * 0.75, i, { 'font-size': 34 }); return g; });
  const bars = E.map(([i, c, , , , w], k) => { const g = svgEl('g', { opacity: 0 }, R.s); txt(g, 610, 470 + k * 60, i, { 'font-size': 32 }); svgEl('rect', { x: 640, y: 448 + k * 60, width: 0, height: 26, rx: 8, fill: c }, g); return g; });
  const fused = svgEl('circle', { cx: 288, cy: 305, r: 0, fill: '#fbbf24', 'fill-opacity': 0.25, stroke: '#fbbf24', 'stroke-width': 6 }, R.s);
  const fl = txt(R.s, 288, 420, '✓ person, 14.2 m', { fill: '#fbbf24', 'font-size': 32, 'font-weight': 900, opacity: 0 });
  txt(R.s, 700, 430, 'trust', { fill: '#94a3b8', 'font-size': 24 });
  FV.scene('fuse', (t, ctx) => {
    head(ctx.el, t); enter($('#fu-p'), t, 0.1, 0.4, 20);
    el.forEach((g, i) => g.setAttribute('opacity', seg(t, frac(ctx, 0, 0.05 + i * 0.08), frac(ctx, 0, 0.15 + i * 0.08)) * (1 - 0.6 * seg(t, frac(ctx, 0, 0.7), frac(ctx, 0, 0.85)))));
    const w = seg(t, frac(ctx, 0, 0.35), frac(ctx, 0, 0.6));
    bars.forEach((g, i) => { g.setAttribute('opacity', w > 0 ? 1 : 0); g.querySelector('rect').setAttribute('width', 170 * E[i][5] / 0.35 * w); });
    const f = seg(t, frac(ctx, 0, 0.7), frac(ctx, 0, 0.85), ease.back); fused.setAttribute('r', 34 * f); fl.setAttribute('opacity', f);
    show($('#fu-t'), f > 0.5 ? pill('sharper than any one sensor', '#fbbf24') : pill('more certain = more weight', '#22d3ee'));
    $('#fu-t').style.opacity = seg(t, 0.4, 0.7);
  });
}
/* OUTRO */
{
  const Wd = [['Many imperfect senses.', '#22d3ee', 0], ['One confident picture.', '#fbbf24', 0.45]];
  const words = Wd.map(([w, c]) => div('', w, $('#oc-w'), `font:900 84px/1.08 Inter;letter-spacing:-.03em;color:${c};text-align:center`));
  FV.scene('outro', (t, ctx) => {
    words.forEach((w, i) => pop(w, t, frac(ctx, 0, Wd[i][2]), 0.45));
    pop($('#oc-gh'), t, frac(ctx, 0, 0.95), 0.5);
  });
}

})();
</script>
</body>
</html>
