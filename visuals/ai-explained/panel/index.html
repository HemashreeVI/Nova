<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Explained Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#eef0fb;--mut:#9aa0c3}
  #fv-stage{background:radial-gradient(1400px 900px at 72% 20%,#2a1650 0%,#110d2a 50%,#08071a 80%);color:var(--ink);font-family:Inter,system-ui,sans-serif}
  #bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(170,150,250,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(170,150,250,.13) 1px,transparent 1px);background-size:80px 80px;opacity:.25}
  .abs{position:absolute}
  #slot{position:absolute;left:142px;top:20px;width:592px;height:1040px;border-radius:30px;border:4px solid var(--acc);box-shadow:0 0 60px color-mix(in srgb,var(--acc) 45%,transparent);background:#000}
  .row{display:flex;align-items:center;gap:26px;padding:20px 28px;border-radius:22px;border:3px solid transparent;margin-bottom:14px}
  .row .n{flex:none;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 28px 'JetBrains Mono';border:3px solid rgba(170,180,250,.35);color:var(--mut)}
  .row .t{font:700 36px/1.25 Inter}
  .dot{width:22px;height:22px;border-radius:50%;background:rgba(170,180,250,.25)}
</style>
</head>
<body>
<div id="fv-stage">
  <div id="bg-grid"></div>
  <section class="fv-scene" data-scene="all">
    <div id="slot"></div>
    <div class="abs" style="left:830px;right:100px;top:90px">
      <div id="kick" class="mono" style="font:800 34px 'JetBrains Mono';letter-spacing:.2em"></div>
      <div id="title" style="font:900 74px/1.06 Inter;letter-spacing:-.035em;margin-top:14px"></div>
      <div id="rows" style="margin-top:46px"></div>
    </div>
    <div class="abs" style="left:830px;right:100px;top:980px;display:flex;align-items:center;gap:16px">
      <div id="dots" style="display:flex;gap:12px"></div>
      <div class="mono" style="margin-left:auto;font-size:26px;color:var(--mut)">📘 github.com/HemashreeVI</div>
    </div>
  </section>
</div>
<script src="panel.js"></script>
<script src="timing.js"></script>
<script src="fv-runtime.js"></script>
<script>
(() => {
const { seg, clamp, ease, $ } = FV;
const P = window.PANEL;   // { part, kicker, title, color, bullets:[[text, start, end]] }
document.documentElement.style.setProperty('--acc', P.color);
$('#kick').textContent = P.kicker; $('#kick').style.color = P.color;
$('#title').textContent = P.title;
const rows = P.bullets.map(([txt], i) => {
  const r = document.createElement('div'); r.className = 'row';
  r.innerHTML = `<div class="n">${i + 1}</div><div class="t">${txt}</div>`;
  $('#rows').appendChild(r); return r;
});
for (let i = 1; i <= 4; i++) { const d = document.createElement('div'); d.className = 'dot'; if (i === P.part) { d.style.background = P.color; d.style.width = '56px'; d.style.borderRadius = '11px'; } else if (i < P.part) d.style.background = 'rgba(238,240,251,.6)'; $('#dots').appendChild(d); }
FV.scene('all', (t) => {
  rows.forEach((r, i) => {
    const [, a, b] = P.bullets[i];
    const cur = t >= a && t < b, done = t >= b;
    const k = seg(t, a, a + 0.4, ease.out);
    r.style.borderColor = cur ? P.color : 'transparent';
    r.style.background = cur ? `${P.color}22` : 'transparent';
    r.style.opacity = cur ? 1 : done ? 0.75 : 0.38;
    r.style.transform = `translateX(${cur ? 14 * k : 0}px)`;
    const n = r.querySelector('.n');
    n.textContent = done ? '✓' : i + 1;
    n.style.background = cur || done ? P.color : 'transparent';
    n.style.color = cur || done ? '#0b0820' : '';
    n.style.borderColor = cur || done ? P.color : '';
  });
});
})();
</script>
</body>
</html>
