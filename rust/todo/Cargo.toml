[package]
name = "ferrodo"
version = "0.3.0"
description = "A fast, friendly todo manager for the terminal, with due dates and a full-screen app"
repository = "https://github.com/HemashreeVI/ferrodo"
license = "MIT"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
